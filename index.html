<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#202124">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Plate Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* Layout: full-screen map. Search pill + chips float on top, round buttons on the right,
   sheets slide up only when asked for. Navigation swaps in a green instruction banner and an ETA bar. */
:root{
  --ui:#303134; --ui2:#3c4043; --ink:#e8eaed; --muted:#9aa0a6; --blue:#8ab4f8;
  --curb:#f2c230; --go:#1e9e5a; --stop:#e5484d; --warn:#f08a24; --gone:#6b7682; --nav:#0b6e4f;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#202124;color:var(--ink);font:16px/1.4 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#map{position:fixed;inset:0}
.maplibregl-ctrl-bottom-left{display:none}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--safeB) + 2px)}
.maplibregl-ctrl-attrib{font-size:10px}

/* Top search */
.top{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(var(--safeT) + 10px) 12px 0;display:flex;flex-direction:column;gap:10px;max-width:584px;margin:0 auto;pointer-events:none}
.top > *{pointer-events:auto}
.pill{display:flex;align-items:center;gap:10px;background:var(--ui);border-radius:28px;padding:6px 6px 6px 16px;box-shadow:0 2px 6px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}
.pill input{all:unset;flex:1;min-width:0;font:500 17px var(--body);color:#fff;padding:8px 0}
.pill input::placeholder{color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;border:0;background:var(--curb);display:grid;place-items:center;flex:0 0 auto;position:relative}
.avatar b{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--stop);color:#fff;font:700 11px/18px var(--body);padding:0 4px;display:none}
.avatar.alert b{display:block}
.clear{border:0;background:none;color:var(--muted);padding:6px;display:none}
.results{background:var(--ui);border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.results button{all:unset;display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;border-top:1px solid var(--ui2);cursor:pointer;box-sizing:border-box}
.results button:first-child{border-top:0}
.results .t{font-weight:600}.results .s{color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--ui);color:var(--ink);border-radius:18px;padding:7px 11px;font:500 14px var(--body);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.35);display:flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:#c2e7ff;color:#001d35}

/* Floating buttons */
.fab{position:fixed;right:12px;z-index:9;width:50px;height:50px;border-radius:50%;background:var(--ui);border:0;box-shadow:0 2px 8px rgba(0,0,0,.45);display:grid;place-items:center;padding:0}
#layersBtn{top:calc(var(--safeT) + 122px)}
#locBtn{bottom:calc(var(--safeB) + 98px)}
#dirBtn{bottom:calc(var(--safeB) + 28px);width:56px;height:56px;border-radius:16px;background:#4dd0e1}
#recenter{bottom:calc(var(--safeB) + 110px);left:auto;right:12px;width:auto;height:44px;border-radius:22px;padding:0 16px;font-weight:600;color:var(--blue);display:none;z-index:15}
.layers{position:fixed;right:12px;top:calc(var(--safeT) + 180px);z-index:11;background:var(--ui);border-radius:16px;padding:12px;display:flex;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.45)}
.layers button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.layers button span{width:58px;height:58px;border-radius:12px;border:2px solid transparent}
.layers button[aria-pressed="true"] span{border-color:var(--blue)}
.layers button[aria-pressed="true"]{color:var(--blue)}
.reasons{display:flex;flex-direction:column;gap:8px}
.reasons button{all:unset;cursor:pointer;background:var(--ui);border-radius:12px;padding:12px 14px;font-weight:500;border:2px solid transparent}
.reasons button[aria-pressed="true"]{border-color:var(--blue);background:#1f2a3a}
textarea.inp,input.inp{font:500 16px var(--body);border:0;border-radius:12px;padding:12px 14px;background:var(--ui);color:var(--ink);width:100%;resize:vertical}
pre.letter{white-space:pre-wrap;font:15px/1.5 var(--body);background:#fff;color:#202124;border-radius:14px;padding:16px;margin:0;max-height:none;user-select:text;-webkit-user-select:text}
ol.ev{margin:0;padding-left:20px;color:var(--ink);font-size:14px;display:flex;flex-direction:column;gap:4px}
#parkBtn{bottom:calc(var(--safeB) + 168px);background:#1a73e8}
#parkBtn span{font:800 24px/1 var(--body);color:#fff}
.verdict{border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center}
.verdict .big2{font:700 21px/1.2 var(--body)}
.verdict .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:800 24px var(--body);color:#fff;flex:0 0 auto}
.verdict.green{background:color-mix(in srgb,#1e8e3e 22%,#202124)}.verdict.green .ic{background:#1e8e3e}
.verdict.yellow{background:color-mix(in srgb,#f29900 22%,#202124)}.verdict.yellow .ic{background:#f29900}
.verdict.red{background:color-mix(in srgb,#d93025 24%,#202124)}.verdict.red .ic{background:#d93025}
.verdict.unknown{background:var(--ui)}.verdict.unknown .ic{background:#5f6368}
ul.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.rules li{background:var(--ui);border-radius:10px;padding:10px 12px;font-size:14px}
#parkedPill{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safeT) + 116px);z-index:10;border:0;border-radius:22px;background:#1a73e8;color:#fff;font-weight:700;padding:9px 16px;box-shadow:0 3px 12px rgba(0,0,0,.4);white-space:nowrap;display:flex;gap:8px;align-items:center}
#parkedPill.soon{background:#d93025;animation:pulse2 1.2s ease-in-out infinite alternate}
@keyframes pulse2{to{background:#a50e0e}}
.carPin{width:34px;height:34px;border-radius:9px;background:#1a73e8;border:3px solid #fff;color:#fff;font:800 17px var(--body);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.signDot{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #d93025;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.checkPin{width:22px;height:22px;border-radius:50%;background:#1a73e8;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
body.navigating #parkBtn,body.navigating #parkedPill{display:none!important}
.inAlert{position:fixed;left:12px;right:12px;top:calc(var(--safeT) + 116px);z-index:11;max-width:560px;margin:0 auto;border-radius:18px;background:#fff;color:#202124;box-shadow:0 8px 28px rgba(0,0,0,.35);display:flex;gap:12px;align-items:flex-start;padding:14px 14px 14px 16px;cursor:pointer;animation:drop .35s ease both}
.inAlert .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.inAlert b{display:block;font-size:16px}
.inAlert .sub{font-size:14px;color:#5f6368;margin-top:2px}
.inAlert .more{font-size:13px;color:#1a73e8;font-weight:600;margin-top:4px}
.inAlert .xx{margin-left:auto;border:0;background:#f1f3f4;color:#5f6368;width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}}
ul.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.alist li{background:var(--ui);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
ul.alist .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:0 0 auto}
ul.alist .t{font-weight:600}
#tixPill{position:fixed;left:12px;bottom:calc(var(--safeB) + 32px);z-index:9;border:0;border-radius:24px;background:var(--ui);box-shadow:0 2px 8px rgba(0,0,0,.45);padding:10px 16px;display:none;align-items:center;gap:10px;font-weight:600;max-width:calc(100% - 100px)}
#tixPill i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
#tixPill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:12;max-width:600px;margin:0 auto;background:#202124;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.5);max-height:72%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease}
.sheet.show{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:12px}
.sheet-head h2{margin:0;font:700 20px var(--body);min-width:0}
.x{border:0;background:var(--ui2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.sheet-body{overflow-y:auto;padding:0 16px calc(var(--safeB) + 20px);display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:10px}
.btn{border:0;border-radius:22px;padding:11px 18px;font-weight:600;background:var(--ui2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--blue);color:#062e6f}
.btn.green{background:#1e8e3e;color:#fff}
.btn.grow{flex:1}
.plateBox{background:#f4f2ea;border-radius:10px;border:3px solid #1d3a6e;padding:6px 12px 8px;display:flex;flex-direction:column;align-items:center}
.plateBox small{font:700 12px var(--display);letter-spacing:.3em;color:#1d3a6e;text-transform:uppercase}
.plateBox input{all:unset;width:100%;text-align:center;font:700 40px/1.1 var(--display);letter-spacing:.12em;color:#16243d;text-transform:uppercase}
.plateBox input::placeholder{color:#b6b3a6}
select{font:600 15px var(--body);border-radius:22px;border:0;background:var(--ui2);color:var(--ink);padding:10px 12px}
.saved{display:flex;gap:8px;flex-wrap:wrap}
.saved button{border:0;border-radius:18px;background:var(--ui);padding:6px 12px;font:700 15px var(--display);letter-spacing:.1em}
.muted{color:var(--muted);font-size:14px}
.big{font:700 28px var(--display);font-variant-numeric:tabular-nums}
.alert{border-radius:12px;padding:10px 14px;font-size:14px}
.alert b{display:block;font-size:15px}
.alert.stop{background:color-mix(in srgb,var(--stop) 18%,#202124)}.alert.stop b{color:#ff8a8d}
.alert.warn{background:color-mix(in srgb,var(--warn) 16%,#202124)}.alert.warn b{color:#ffb36b}
.alert.go{background:color-mix(in srgb,var(--go) 18%,#202124)}.alert.go b{color:#6fdc9b}
.seg{display:flex;gap:6px;overflow-x:auto}
.seg button{flex:0 0 auto;border:1px solid var(--ui2);background:none;border-radius:16px;padding:5px 12px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#c2e7ff;color:#001d35;border-color:#c2e7ff}
ul.tix{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.tix li{background:var(--ui);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;cursor:pointer}
.vio{font-weight:600;min-width:0}
.amt{font:700 19px var(--display);text-align:right;font-variant-numeric:tabular-nums}
.meta{color:var(--muted);font-size:13px;min-width:0}
.chipS{justify-self:end;font:700 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:6px;white-space:nowrap;align-self:start}
.chipS.open{background:var(--warn);color:#1a0e02}.chipS.penalty{background:var(--stop);color:#fff}
.chipS.closed,.chipS.dismissed{background:color-mix(in srgb,var(--go) 25%,transparent);color:#6fdc9b}
.chipS.expired{background:var(--ui2);color:var(--muted)}
.links{display:flex;gap:14px;font-size:14px;flex-wrap:wrap}
a{color:var(--blue)}
.note{color:var(--muted);font-size:12px}
.stats{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.camline{display:flex;align-items:center;gap:8px;color:#ffb36b;font-weight:600;font-size:14px}

/* Pins and popups */
.pin{width:30px;height:40px;cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.pin svg{display:block;width:100%;height:100%;transform-origin:50% 100%;transition:transform .15s}
.pin.sel svg{transform:scale(1.35)}
.maplibregl-popup-content{background:var(--ui);color:var(--ink);border-radius:14px;padding:12px 14px;font:14px var(--body);box-shadow:0 6px 20px rgba(0,0,0,.45);min-width:220px}
.maplibregl-popup-tip{border-top-color:var(--ui)!important;border-bottom-color:var(--ui)!important}
.maplibregl-popup-close-button{color:var(--muted);font-size:20px;padding:2px 8px}
.pop h3{margin:0 24px 2px 0;font-size:15px}
.pop .amt{text-align:left;font-size:22px}
.pop .links{margin-top:6px}
.me{width:22px;height:22px;border-radius:50%;background:#4285f4;border:3px solid #fff;box-shadow:0 0 0 7px rgba(66,133,244,.22),0 1px 4px rgba(0,0,0,.4);position:relative}
.me.heading::after{content:"";position:absolute;left:50%;top:-15px;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:13px solid rgba(66,133,244,.55)}
.me.nav{width:52px;height:52px;background:none;border:0;box-shadow:none}
.me.nav::after{display:none}
.me.nav svg{display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}

/* Navigation */
#navTop{position:fixed;left:0;right:0;top:0;z-index:14;padding:calc(var(--safeT) + 8px) 10px 0;display:none;flex-direction:column;gap:8px;max-width:600px;margin:0 auto}
.instr{background:var(--nav);border-radius:20px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.instr svg{flex:0 0 auto}
.instr .dist{font:700 28px/1.1 var(--body);white-space:nowrap}
.instr .street{font:600 20px/1.2 var(--body)}
.instr .then{font-size:14px;opacity:.85}
.camAlert{background:#d93025;border-radius:14px;padding:10px 14px;display:none;align-items:center;gap:12px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.4);animation:pulse 1s ease-in-out infinite alternate}
.camAlert .lim{margin-left:auto;background:#fff;color:#111;border:3px solid #111;border-radius:6px;padding:2px 6px;text-align:center;font:700 10px/1.1 var(--body)}
.camAlert .lim b{display:block;font-size:20px}
@keyframes pulse{to{background:#b3261e}}
#navBottom{position:fixed;left:0;right:0;bottom:0;z-index:14;background:#202124;border-radius:20px 20px 0 0;padding:14px 16px calc(var(--safeB) + 14px);display:none;align-items:center;gap:14px;box-shadow:0 -6px 20px rgba(0,0,0,.45);max-width:600px;margin:0 auto}
#navBottom .eta{font:700 26px var(--body);color:#81c995}
#navBottom .sub{color:var(--muted);font-size:14px}
#navBottom .end{margin-left:auto;background:#d93025;color:#fff;padding:12px 22px;border-radius:26px}
#navBottom .ov{background:var(--ui2);width:46px;height:46px;border-radius:50%;padding:0}
#speedo{position:fixed;left:12px;bottom:calc(var(--safeB) + 110px);z-index:14;width:62px;height:62px;border-radius:50%;background:#fff;color:#111;display:none;flex-direction:column;align-items:center;justify-content:center;font:700 22px/1 var(--body);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#speedo small{font-size:10px;font-weight:600}
#speedo.over{background:#d93025;color:#fff}
body.navigating .inAlert,body.navigating .top,body.navigating .fab:not(#recenter),body.navigating #tixPill,body.navigating .layers{display:none!important}
body.navigating #navTop,body.navigating #navBottom,body.navigating #speedo{display:flex}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.camAlert{animation:none}}
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>

<div class="top" id="top">
  <div class="pill">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#9aa0a6" stroke-width="2.4"/><path d="m15.5 15.5 5 5" stroke="#9aa0a6" stroke-width="2.4" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search here" autocomplete="off" enterkeyhint="search" aria-label="Search for a place">
    <button class="clear" id="qClear" type="button" aria-label="Clear search">✕</button>
    <button class="avatar" id="plateBtn" type="button" aria-label="My plate and tickets">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11v6a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H8v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-6zm2.3-1h9.4l-1-3.2a.5.5 0 0 0-.5-.3H8.8a.5.5 0 0 0-.5.3l-1 3.2zM7.5 14a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4zm9 0a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4z" fill="#14110a"/></svg>
      <b id="badge"></b>
    </button>
  </div>
  <div class="results" id="results" hidden></div>
  <div class="chips" id="chips">
    <button class="chip" type="button" data-layer="tickets"><svg width="14" height="18" viewBox="0 0 30 40" aria-hidden="true"><path d="M15 1C7.3 1 1.5 6.8 1.5 14.3 1.5 24 15 39 15 39s13.5-15 13.5-24.7C28.5 6.8 22.7 1 15 1z" fill="#e5484d"/></svg>Tickets</button>
    <button class="chip" type="button" data-layer="speed"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#f08a24"/><path d="M6.5 9.5h2l1-1.5h5l1 1.5h2a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1z" fill="#fff"/><circle cx="12" cy="13" r="1.8" fill="#f08a24"/></svg>Speed cams</button>
    <button class="chip" type="button" data-layer="redlight"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#d93025"/><rect x="9" y="5" width="6" height="14" rx="2" fill="#fff"/><circle cx="12" cy="8.5" r="1.6" fill="#d93025"/><circle cx="12" cy="12" r="1.6" fill="#9aa0a6"/><circle cx="12" cy="15.5" r="1.6" fill="#9aa0a6"/></svg>Red lights</button>
  </div>
</div>

<button class="fab" id="layersBtn" type="button" aria-label="Map type"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8.5l10 5.5 10-5.5L12 3zm0 13.2L4.2 12 2 13.2l10 5.5 10-5.5-2.2-1.2L12 16.2z" fill="#8ab4f8"/></svg></button>
<div class="layers" id="layers" hidden>
  <button type="button" data-style="map"><span style="background:linear-gradient(135deg,#f2efe9 40%,#aad3df 40% 55%,#f2efe9 55%)"></span>Default</button>
  <button type="button" data-style="sat"><span style="background:linear-gradient(135deg,#3d5a3a,#6b6b55 50%,#2f4b5e)"></span>Satellite</button>
  <button type="button" data-style="dark"><span style="background:linear-gradient(135deg,#1d2633 40%,#0e1621 40% 55%,#1d2633 55%)"></span>Night</button>
</div>
<button class="fab" id="locBtn" type="button" aria-label="Show my location"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6" fill="#8ab4f8"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="#8ab4f8" stroke-width="2"/><path d="M12 1.5v3.5m0 14v3.5M1.5 12H5m14 0h3.5" stroke="#8ab4f8" stroke-width="2"/></svg></button>
<button class="fab" id="parkBtn" type="button" aria-label="Can I park here?"><span>P</span></button>
<button id="parkedPill" type="button" hidden></button>

<button class="fab" id="recenter" type="button">Re-center</button>

  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x" id="sheetX" type="button" aria-label="Close">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div id="navTop">
  <div class="instr">
    <svg id="navArrow" width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"></svg>
    <div style="min-width:0"><div class="dist" id="navDist"></div><div class="street" id="navStreet"></div><div class="then" id="navThen"></div></div>
  </div>
  <div class="camAlert" id="camAlert">
    <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 8.5h3l1.5-2h6l1.5 2h3a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1z" fill="#fff"/><circle cx="12" cy="13.5" r="3" fill="#d93025"/></svg>
    <div><div id="camText">Speed camera ahead</div><div id="camDist" style="font-weight:500;font-size:14px"></div></div>

  </div>
</div>

  <div><div class="eta" id="navEta"></div><div class="sub" id="navSub"></div></div>
  <button class="btn ov" id="navOv" type="button" aria-label="Route overview" style="margin-left:auto"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4a3 3 0 0 1 0 6 3 3 0 0 1 0-6zm10 10a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM7 10v4a4 4 0 0 0 4 4h3" fill="none" stroke="#e8eaed" stroke-width="2" stroke-linecap="round"/></svg></button>
  <button class="btn end" id="navEnd" type="button" style="margin-left:0">Exit</button>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (n) => "$" + (n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
const title = (s) => String(s || "").toLowerCase().replace(/\b\w/g, (m) => m.toUpperCase());
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const NYC = [-73.95, 40.7];
const toRad = (d) => (d * Math.PI) / 180, toDeg = (r) => (r * 180) / Math.PI;
function dist(a, b) {
  const R = 6371000, dLat = toRad(b[1] - a[1]), dLng = toRad(b[0] - a[0]);
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[1])) * Math.cos(toRad(b[1])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function bearing(a, b) {
  const y = Math.sin(toRad(b[0] - a[0])) * Math.cos(toRad(b[1]));
  const x = Math.cos(toRad(a[1])) * Math.sin(toRad(b[1])) - Math.sin(toRad(a[1])) * Math.cos(toRad(b[1])) * Math.cos(toRad(b[0] - a[0]));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}
const angDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);
function fmtDist(m) { const mi = m / 1609.34; return mi >= 0.1 ? `${mi < 10 ? mi.toFixed(1) : Math.round(mi)} mi` : `${Math.max(50, Math.round((m * 3.281) / 50) * 50)} ft`; }
function sayDist(m) { const mi = m / 1609.34; return mi >= 0.2 ? `${mi < 10 ? mi.toFixed(1) : Math.round(mi)} miles` : `${Math.max(100, Math.round((m * 3.281) / 100) * 100)} feet`; }
function fmtMin(s) { const m = Math.max(1, Math.round(s / 60)); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} hr ${m % 60} min`; }
const clock = (secs) => new Date(Date.now() + secs * 1000).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });

// ================= MAP =================
const STYLES = { map: "https://tiles.openfreemap.org/styles/liberty", sat: "https://tiles.openfreemap.org/styles/liberty", dark: "https://tiles.openfreemap.org/styles/dark" };
let mapType = store.get("mapType", "map");
const map = new maplibregl.Map({ container: "map", style: STYLES[mapType], center: NYC, zoom: 11, attributionControl: { compact: true } });
let layerOn = store.get("layers", { tickets: true, speed: true, redlight: true });
let cams = [];

function camIcon(color, kind) {
  const s = 56, c = document.createElement("canvas"); c.width = c.height = s; const g = c.getContext("2d");
  const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fill(); };
  g.fillStyle = "#fff"; g.beginPath(); g.arc(28, 28, 27, 0, 7); g.fill();
  g.fillStyle = color; g.beginPath(); g.arc(28, 28, 23, 0, 7); g.fill();
  g.fillStyle = "#fff";
  if (kind === "speed") { rr(13, 21, 30, 19, 3); g.fillRect(22, 17, 12, 6); g.fillStyle = color; g.beginPath(); g.arc(28, 30.5, 5.5, 0, 7); g.fill(); }
  else { rr(20, 12, 16, 32, 5); [[18, "#d93025"], [28, "#9aa0a6"], [38, "#9aa0a6"]].forEach(([y, col]) => { g.fillStyle = col; g.beginPath(); g.arc(28, y, 4, 0, 7); g.fill(); }); }
  return { width: s, height: s, data: g.getImageData(0, 0, s, s).data };
}
const camFilter = () => ["in", ["get", "type"], ["literal", ["speed", "redlight"].filter((t) => layerOn[t])]];
const camGeo = () => ({ type: "FeatureCollection", features: cams.map((c, i) => ({ type: "Feature", properties: { i, type: c.type }, geometry: { type: "Point", coordinates: [c.lng, c.lat] } })) });

function addOverlays() {
  if (mapType === "sat") {
    if (!map.getSource("esri")) map.addSource("esri", { type: "raster", tileSize: 256, maxzoom: 19, tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], attribution: "Imagery © Esri" });
    if (!map.getLayer("esri")) map.addLayer({ id: "esri", type: "raster", source: "esri" }, map.getLayer("tunnel_motorway_link_casing") ? "tunnel_motorway_link_casing" : undefined);
    map.getStyle().layers.forEach((l) => { if (/^(building|road_area|road_(minor|service|path|link)|tunnel_|bridge_(street|service|path|link))/.test(l.id) || /casing/.test(l.id)) map.setLayoutProperty(l.id, "visibility", "none"); });
  }
  if (!map.hasImage("cam-speed")) map.addImage("cam-speed", camIcon("#f08a24", "speed"), { pixelRatio: 2 });
  if (!map.hasImage("cam-red")) map.addImage("cam-red", camIcon("#d93025", "red"), { pixelRatio: 2 });
  if (!map.getSource("route")) map.addSource("route", { type: "geojson", data: routeGeo() });
  if (!map.getSource("done")) map.addSource("done", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  if (!map.getLayer("route-casing")) map.addLayer({ id: "route-casing", type: "line", source: "route", layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": "#0b57d0", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 7, 16, 16] } });
  if (!map.getLayer("route-line")) map.addLayer({ id: "route-line", type: "line", source: "route", layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": "#4285f4", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 4.5, 16, 11] } });
  if (!map.getLayer("done-line")) map.addLayer({ id: "done-line", type: "line", source: "done", layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": "#9aa0a6", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 4.5, 16, 12] } });
  if (!map.getSource("cams")) map.addSource("cams", { type: "geojson", data: camGeo() });
  if (!map.getLayer("cams")) map.addLayer({ id: "cams", type: "symbol", source: "cams", minzoom: 10.5, filter: camFilter(),
    layout: { "icon-image": ["case", ["==", ["get", "type"], "speed"], "cam-speed", "cam-red"], "icon-size": ["interpolate", ["linear"], ["zoom"], 10.5, 0.45, 14, 0.8, 17, 1], "icon-allow-overlap": true } });
}
map.on("style.load", addOverlays);

const DIRNAME = { NB: "northbound", SB: "southbound", EB: "eastbound", WB: "westbound" };
map.on("click", "cams", (e) => {
  const c = cams[e.features[0].properties.i];
  new maplibregl.Popup({ offset: 14 }).setLngLat([c.lng, c.lat]).setHTML(`<div class="pop"><h3>${c.type === "speed" ? "Speed camera" : "Red light camera"}</h3>
    <div>${esc(title(c.name))}</div>
    <div class="meta">${c.dir ? `Catches ${DIRNAME[c.dir]} traffic · ` : ""}${c.limit && c.type === "speed" ? `${c.limit} mph limit · ` : ""}${c.n.toLocaleString()} tickets this year</div></div>`).addTo(map);
});
map.on("mouseenter", "cams", () => (map.getCanvas().style.cursor = "pointer"));
map.on("mouseleave", "cams", () => (map.getCanvas().style.cursor = ""));

async function loadCams(tries = 0) {
  try {
    const j = await (await fetch("/api/cameras")).json();
    if (j.status === "ready") { cams = j.cameras; map.getSource("cams")?.setData(camGeo()); if (route) route.camsOnRoute = camsAlong(route); return; }
  } catch {}
  if (tries < 40) setTimeout(() => loadCams(tries + 1), 10000);
}
loadCams();

function setLook(t) {
  $("#layers").hidden = true;
  if (t === mapType) return;
  mapType = t; store.set("mapType", t); map.setStyle(STYLES[t]); paintLayerBtns();
}
function paintLayerBtns() { document.querySelectorAll("[data-style]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.style === mapType)); }
paintLayerBtns();
document.querySelectorAll("[data-style]").forEach((b) => (b.onclick = () => setLook(b.dataset.style)));
$("#layersBtn").onclick = (e) => { e.stopPropagation(); $("#layers").hidden = !$("#layers").hidden; };
document.addEventListener("pointerdown", (e) => { if (!$("#layers").hidden && !e.target.closest("#layers,#layersBtn")) $("#layers").hidden = true; }, true);
map.on("click", () => { $("#layers").hidden = true; $("#results").hidden = true; });

function paintChips() { document.querySelectorAll("[data-layer]").forEach((b) => b.setAttribute("aria-pressed", !!layerOn[b.dataset.layer])); }
paintChips();
document.querySelectorAll("[data-layer]").forEach((b) => (b.onclick = () => {
  const k = b.dataset.layer; layerOn[k] = !layerOn[k]; store.set("layers", layerOn); paintChips();
  if (k === "tickets") drawPins(false); else if (map.getLayer("cams")) map.setFilter("cams", camFilter());
}));

// ================= LOCATION =================
let me = null, meMarker = null, heading = null, speedMps = 0, watchId = null, lastFix = null;
const waiters = [];
function startWatch() {
  if (watchId !== null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(
    (p) => { if (!nav.sim) onFix({ lng: p.coords.longitude, lat: p.coords.latitude, heading: p.coords.heading, speed: p.coords.speed }); },
    (err) => { if (err.code === 1) { watchId = null; } },
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
}
const PUCK = '<svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="#fff"/><circle cx="26" cy="26" r="19" fill="#1a73e8"/><path d="M26 12 35.5 36 26 31 16.5 36z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>';
function ensureMarker(pos) {
  if (meMarker) return;
  const d = document.createElement("div"); d.className = "me";
  meMarker = new maplibregl.Marker({ element: d, rotationAlignment: "map", pitchAlignment: "map" }).setLngLat(pos).addTo(map);
  anim.pos = pos.slice();
}
function onFix(f) {
  const pos = [f.lng, f.lat], now = performance.now();
  if (lastFix) {
    const moved = dist(lastFix.pos, pos), dt = (Date.now() - lastFix.t) / 1000;
    if (f.speed == null && dt > 0) f.speed = moved / dt;
    if ((f.heading == null || isNaN(f.heading)) && moved > 4) f.heading = bearing(lastFix.pos, pos);
  }
  if (f.heading != null && !isNaN(f.heading) && (f.speed || 0) > 1.5) heading = f.heading;
  speedMps = f.speed || 0; lastFix = { pos, t: Date.now() }; me = pos;
  ensureMarker(pos);
  anim.fixPos = pos; anim.fixT = now;
  const el = meMarker.getElement();
  if (nav.active) { if (el.className !== "me nav") { el.className = "me nav"; el.innerHTML = PUCK; } }
  else { el.className = "me" + (heading != null ? " heading" : ""); el.innerHTML = ""; }
  if (nav.active) navTick(pos); else freeDriveCams(pos);
  startAnim();
  waiters.splice(0).forEach((fn) => fn(pos));
}

// ---------- Smooth motion (runs every frame, like Google Maps / Waze) ----------
// Between GPS updates the car keeps gliding along the route at its current speed,
// and is gently pulled toward each new GPS reading instead of jumping to it.
const anim = { running: false, last: 0, pos: null, fixPos: null, fixT: 0, along: 0, brg: 0, zoom: 17, routeHint: 0 };
const lerpAng = (a, b, t) => a + ((((b - a) % 360) + 540) % 360 - 180) * t;
function startAnim() { if (!anim.running) { anim.running = true; anim.last = performance.now(); requestAnimationFrame(frame); } }
function frame(now) {
  const dt = Math.min(0.1, (now - anim.last) / 1000); anim.last = now;
  if (!meMarker || !anim.fixPos) { anim.running = false; return; }
  let pos, brg;
  const onRoute = nav.active && route && nav.offCount === 0;
  if (onRoute) {
    // Predict where the car is now, then ease toward that prediction
    const since = (now - anim.fixT) / 1000;
    const target = Math.min(route.total, nav.along + speedMps * Math.min(since, 2));
    if (Math.abs(target - anim.along) > 150) anim.along = target;              // big jump (reroute / first fix)
    anim.along += speedMps * dt;                                              // keep rolling at current speed
    anim.along += (target - anim.along) * Math.min(1, dt * 2.5);              // soft correction
    anim.along = Math.max(0, Math.min(route.total, anim.along));
    pos = pointAtFast(route, anim.along);
    const ahead = pointAtFast(route, Math.min(route.total, anim.along + 25));
    brg = dist(pos, ahead) > 1 ? bearing(pos, ahead) : anim.brg;
  } else {
    const k = Math.min(1, dt * 4);
    pos = [anim.pos[0] + (anim.fixPos[0] - anim.pos[0]) * k, anim.pos[1] + (anim.fixPos[1] - anim.pos[1]) * k];
    brg = heading ?? anim.brg;
  }
  anim.pos = pos;
  anim.brg = lerpAng(anim.brg, brg, Math.min(1, dt * 3)); anim.brg = (anim.brg + 360) % 360;
  meMarker.setLngLat(pos);
  meMarker.setRotation(anim.brg);
  if (nav.active && nav.follow) {
    // Zoom out a little at highway speed, in a little on city streets
    const mph = speedMps * 2.237, wantZoom = mph > 45 ? 16 : mph > 25 ? 16.6 : 17.3;
    anim.zoom += (wantZoom - anim.zoom) * Math.min(1, dt * 0.8);
    map.jumpTo({ center: pos, bearing: anim.brg, pitch: 62, zoom: anim.zoom, padding: { top: Math.round(innerHeight * 0.42), bottom: 90, left: 0, right: 0 } });
  }
  const moving = nav.active || Math.abs(anim.fixPos[0] - pos[0]) + Math.abs(anim.fixPos[1] - pos[1]) > 1e-7;
  if (moving) requestAnimationFrame(frame); else anim.running = false;
}
function pointAtFast(R, d) {
  let i = Math.min(anim.routeHint, R.cum.length - 2);
  while (i > 0 && R.cum[i] > d) i--;
  while (i < R.cum.length - 2 && R.cum[i + 1] < d) i++;
  anim.routeHint = i;
  const seg = R.cum[i + 1] - R.cum[i] || 1, t = Math.max(0, Math.min(1, (d - R.cum[i]) / seg));
  return [R.coords[i][0] + (R.coords[i + 1][0] - R.coords[i][0]) * t, R.coords[i][1] + (R.coords[i + 1][1] - R.coords[i][1]) * t];
}
function getMe(timeout = 15000) {
  if (me) return Promise.resolve(me);
  startWatch();
  return new Promise((res, rej) => { waiters.push(res); setTimeout(() => rej(new Error("no-fix")), timeout); });
}
$("#locBtn").onclick = async () => {
  try { const p = await getMe(); map.flyTo({ center: p, zoom: 16, duration: 800 }); }
  catch { notice("Location needed", "Allow location for this site. On iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using."); }
};

// ================= VOICE =================
let voiceOn = store.get("voice", true);
function speak(text) {
  if (!voiceOn || !("speechSynthesis" in window)) return;
  try { const u = new SpeechSynthesisUtterance(text); u.rate = 1.02; u.lang = "en-US"; speechSynthesis.speak(u); } catch {}
}

// ================= SHEET =================
let sheetMode = null;
function openSheet(t, html, mode = null) { sheetMode = mode; $("#sheetTitle").textContent = t; $("#sheetBody").innerHTML = html; $("#sheet").classList.add("show"); $("#results").hidden = true; }
function closeSheet() {
  $("#sheet").classList.remove("show");
  if (sheetMode === "route" && !nav.active) clearRoute();
  if ((sheetMode === "place" || sheetMode === "route") && !nav.active) { destMarker?.remove(); destMarker = null; }
  sheetMode = null;
}
$("#sheetX").onclick = () => closeSheet();
function notice(h, msg) { openSheet(h, `<p class="muted" style="margin:0">${esc(msg)}</p><button class="btn primary" type="button" id="ok">OK</button>`); $("#ok").onclick = closeSheet; }

// ================= TICKETS =================
let data = null, filter = "all", markers = {}, popup = null;
const LABEL = { open: "Open", penalty: "Penalty added", closed: "Paid", dismissed: "Dismissed", expired: "Expired" };
const HEX = { open: "#f08a24", penalty: "#e5484d", closed: "#1e9e5a", dismissed: "#1e9e5a", expired: "#6b7682" };
const isCamera = (v) => /PHTO|CAMERA|BUS LANE|RED LIGHT/i.test(v);
const shortDate = (d) => (d ? new Date(d + "T12:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "");

function pinSVG(t) {
  const c = HEX[t.status];
  const ring = t.location.approx ? 'stroke="#fff" stroke-width="2" stroke-dasharray="3 2"' : 'stroke="#fff" stroke-width="2"';
  const icon = isCamera(t.violation)
    ? `<path d="M9.5 11h2l1-1.5h5l1 1.5h2a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1z" fill="#fff"/><circle cx="15" cy="15" r="2.2" fill="${c}"/>`
    : '<text x="15" y="19.5" text-anchor="middle" font-family="Barlow,Arial" font-weight="700" font-size="13" fill="#fff">$</text>';
  return `<svg viewBox="0 0 30 40" aria-hidden="true"><path d="M15 1C7.3 1 1.5 6.8 1.5 14.3 1.5 24 15 39 15 39s13.5-15 13.5-24.7C28.5 6.8 22.7 1 15 1z" fill="${c}" ${ring}/>${icon}</svg>`;
}
function showTicket(t) {
  if (!t.location) return;
  popup?.remove();
  const amount = t.due > 0 ? money(t.due) + " due" : t.fine !== null ? money(t.fine) : "";
  popup = new maplibregl.Popup({ offset: 38, maxWidth: "280px" }).setLngLat([t.location.lng, t.location.lat]).setHTML(`<div class="pop">
    <h3>${esc(title(t.violation))}</h3><div class="amt">${amount}</div>
    <div class="meta">${shortDate(t.issued)}${t.time ? " · " + esc(t.time) : ""}</div>
    <div class="meta">${esc(title(t.location.address))}${t.location.approx ? " (approx.)" : ""}</div>
    <div style="margin-top:6px"><span class="chipS ${t.status}">${LABEL[t.status]}</span>${t.judgment ? ' <span class="meta" style="color:#ff8a8d">Likely in judgment</span>' : ""}</div>
    <div class="links">${t.image ? `<a href="${esc(t.image)}" target="_blank" rel="noopener">View ticket</a>` : ""}${t.due > 0 ? `<a href="https://a836-citypay.nyc.gov/citypay/Parking" target="_blank" rel="noopener">Pay</a><a href="#" data-dispute="${esc(t.summons)}">Dispute</a>` : ""}</div></div>`).addTo(map);
  document.querySelectorAll(".pin.sel").forEach((p) => p.classList.remove("sel"));
  markers[t.summons]?.getElement().classList.add("sel");
}
function drawPins(fit) {
  Object.values(markers).forEach((m) => m.remove()); markers = {};
  if (!data || !layerOn.tickets) return;
  const pts = data.tickets.filter((t) => t.location);
  const b = new maplibregl.LngLatBounds();
  pts.forEach((t) => {
    const el = document.createElement("div"); el.className = "pin"; el.innerHTML = pinSVG(t);
    el.onclick = (e) => { e.stopPropagation(); showTicket(t); };
    markers[t.summons] = new maplibregl.Marker({ element: el, anchor: "bottom" }).setLngLat([t.location.lng, t.location.lat]).addTo(map);
    b.extend([t.location.lng, t.location.lat]);
  });
  if (fit && pts.length) map.fitBounds(b, { padding: { top: 150, bottom: 110, left: 50, right: 70 }, maxZoom: 15, duration: 700 });
}
function paintPill() {
  const pill = $("#tixPill");
  if (!data) { pill.style.display = "none"; return; }
  const s = data.summary;
  pill.style.display = "flex";
  pill.querySelector("i").style.background = s.bootRisk || s.penaltiesAdded ? "var(--stop)" : s.openCount ? "var(--warn)" : "var(--go)";

  $("#navStreet").textContent = next.maneuver.type === "arrive" ? "Destination" : next.name || next.ref || instruction(next);
  $("#navThen").textContent = after && toNext < 400 ? `Then: ${instruction(after)}` : "";
  const spk = (key, txt) => { if (!nav.spoken[key]) { nav.spoken[key] = 1; speak(txt); } };
  if (toNext < 600 && toNext > 250) spk(`f${k}`, `In ${sayDist(toNext)}, ${instruction(next)}`);
  if (toNext <= 90) spk(`n${k}`, instruction(next));
  const left = Math.max(0, R.total - nav.along), secs = R.duration * (left / R.total);
  $("#navEta").textContent = fmtMin(secs);
  $("#navSub").textContent = `${fmtDist(left)} · ${clock(secs)}`;
  const ahead = R.camsOnRoute.find((c) => c.along > nav.along - 10 && c.along - nav.along < 500);
  showCam(ahead ? { ...ahead, meters: ahead.along - nav.along } : null);
  updateSpeedo(ahead?.type === "speed" ? ahead.limit : null);
  if (left < 25) { spk("arr", "You have arrived"); setTimeout(() => nav.active && endNav(), 3000); }
  const doneCoords = R.coords.slice(0, nav.idx + 1).concat([pointAt(R, nav.along)]);
  map.getSource("done")?.setData({ type: "FeatureCollection", features: doneCoords.length > 1 ? [{ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: doneCoords } }] : [] });
}
function showCam(c) {
  const box = $("#camAlert");
  if (!c) { box.style.display = "none"; return; }
  box.style.display = "flex";
  $("#camText").textContent = c.type === "speed" ? "Speed camera ahead" : "Red light camera ahead";
  $("#camDist").textContent = c.meters > 15 ? fmtDist(c.meters) : "Now";
  const showLim = c.type === "speed" && c.limit;
  $("#camLim").style.display = showLim ? "block" : "none";
  $("#camLim b").textContent = c.limit || "";
  const key = `${c.lng},${c.lat}`;
  if (Date.now() - (nav.camWarned[key] || 0) > 5 * 60 * 1000) {
    nav.camWarned[key] = Date.now();
    speak(c.type === "speed" ? `Speed camera ahead${showLim ? `. Speed limit ${c.limit}` : ""}` : "Red light camera ahead");
  }
}
function updateSpeedo(limit) {
  const mph = Math.round(speedMps * 2.237);
  $("#speedNum").textContent = mph;
  $("#speedo").classList.toggle("over", !!limit && mph > limit + 2);
}
const freeWarned = {};
function freeDriveCams(pos) {
  if (heading == null || speedMps < 4 || !cams.length) return;
  for (const c of cams) {
    if (!layerOn[c.type]) continue;
    if (Math.abs(c.lat - pos[1]) > 0.004 || Math.abs(c.lng - pos[0]) > 0.005) continue;
    const p = [c.lng, c.lat], d = dist(pos, p);
    if (d > 300 || angDiff(bearing(pos, p), heading) > 30) continue;
    if (c.dir && angDiff(heading, DIRB[c.dir]) > 60) continue;
    const key = `${c.lng},${c.lat}`;
    if (Date.now() - (freeWarned[key] || 0) < 5 * 60 * 1000) continue;
    freeWarned[key] = Date.now();
    speak(c.type === "speed" ? `Speed camera ahead${c.limit ? `. Limit ${c.limit}` : ""}` : "Red light camera ahead");
    break;
  }
}

// ================= IN-APP ALERTS =================
// Compares what the city shows now with what this phone saw last time.
// Same rules as the email alerts: new tickets, late penalties coming up, judgment, boot risk.
const STEPS = [
  { key: "p30", from: 23, to: 30, msg: (d) => `Late penalty in ${d} day${d === 1 ? "" : "s"}` },
  { key: "p60", from: 53, to: 60, msg: (d) => `Another late penalty in ${d} day${d === 1 ? "" : "s"}` },
  { key: "p90", from: 83, to: 90, msg: (d) => `Third late penalty in ${d} day${d === 1 ? "" : "s"}` },
  { key: "j100", from: 93, to: 100, msg: (d) => `Goes into judgment in ${d} day${d === 1 ? "" : "s"}` },
];
const CAM_STEPS = [STEPS[0], STEPS[1], { key: "j75", from: 68, to: 75, msg: STEPS[3].msg }]; // camera tickets: judgment ~day 75
let pending = [];
function buildAlerts(d) {
  const pk = `${d.plate}|${d.state}`;
  const known = store.get("known", {})[pk];               // tickets this phone has already seen
  const seen = store.get("seenAlerts", {})[pk] || {};      // alerts already dismissed
  const out = [];
  const isOpen = (t) => t.status === "open" || t.status === "penalty";
  if (d.summary.bootRisk && !seen.boot) out.push({ key: "boot", color: "#d93025", icon: "!", title: `Boot / tow risk · ${money(d.summary.judgmentDue)}`, sub: "Over $350 in judgments. Pay or dispute these first." });
  for (const t of d.tickets) {
    const what = `${title(t.violation)} · ${shortDate(t.issued)}`;
    if (known && !(t.summons in known) && isOpen(t)) {
      const k = `${t.summons}:new`;
      if (!seen[k]) out.push({ key: k, t, color: "#d93025", icon: "$", title: `New ticket · ${money(t.due ?? t.fine)}`, sub: what });
      continue;
    }
    if (!isOpen(t) || t.ageDays == null) continue;
    for (const s of (isCamera(t.violation) ? CAM_STEPS : STEPS)) {
      const k = `${t.summons}:${s.key}`;
      if (t.ageDays >= s.from && t.ageDays < s.to && !seen[k]) out.push({ key: k, t, color: s.key[0] === "j" ? "#d93025" : "#e37400", icon: "⏱", title: `${s.msg(s.to - t.ageDays)} · ${money(t.due)}`, sub: what });
    }
    const jk = `${t.summons}:judgment`;
    if (t.judgment && !seen[jk]) out.push({ key: jk, t, color: "#d93025", icon: "⚖", title: `Likely in judgment · ${money(t.due)}`, sub: what });
  }
  // Remember today's tickets for next time
  const all = store.get("known", {}); all[pk] = Object.fromEntries(d.tickets.map((t) => [t.summons, t.status])); store.set("known", all);
  return out;
}
function checkInAppAlerts() {
  if (!data) return;
  pending = buildAlerts(data);
  const box = $("#inAlert");
  if (!pending.length) { box.hidden = true; return; }
  const a = pending[0];
  box.innerHTML = `<div class="ico" style="background:${a.color};color:#fff;font-weight:700">${esc(a.icon)}</div>
    <div style="min-width:0"><b>${esc(a.title)}</b><div class="sub">${esc(a.sub)}</div>${pending.length > 1 ? `<div class="more">+${pending.length - 1} more alert${pending.length > 2 ? "s" : ""}</div>` : ""}</div>
    <button class="xx" type="button" aria-label="Dismiss">✕</button>`;
  box.hidden = false;
  box.querySelector(".xx").onclick = (e) => { e.stopPropagation(); markSeen(pending); box.hidden = true; };
  box.onclick = () => { box.hidden = true; alertsSheet(); };
  $("#badge").textContent = pending.length; $("#plateBtn").classList.add("alert");
}
function markSeen(list) {
  const pk = `${data.plate}|${data.state}`, all = store.get("seenAlerts", {}), m = all[pk] || {};
  list.forEach((a) => (m[a.key] = Date.now())); all[pk] = m; store.set("seenAlerts", all);
}
function alertsSheet() {
  const list = pending.slice();
  openSheet(`Alerts · ${data.plate}`, `
    <ul class="alist">${list.map((a, i) => `<li><span class="dot" style="background:${a.color}"></span>
      <div style="min-width:0;flex:1"><div class="t">${esc(a.title)}</div><div class="meta">${esc(a.sub)}</div>
      <div class="links" style="margin-top:4px">${a.t?.location ? `<a href="#" data-map="${i}">Show on map</a>` : ""}
      ${a.t?.due > 0 ? `<a href="https://a836-citypay.nyc.gov/citypay/Parking" target="_blank" rel="noopener">Pay</a><a href="#" data-dispute="${esc(a.t.summons)}">Dispute</a>` : ""}</div></div></li>`).join("")}</ul>
    <button class="btn primary" type="button" id="gotIt">Got it</button>
    <p class="note">Penalty and judgment dates are estimates from the ticket's issue date. Your tickets are rechecked each time you open the app.</p>`, "alerts");
  $("#gotIt").onclick = () => { markSeen(list); pending = []; paintPill(); closeSheet(); };
  document.querySelectorAll("[data-map]").forEach((a) => (a.onclick = (e) => {
    e.preventDefault(); const t = list[+a.dataset.map].t; closeSheet();
    map.flyTo({ center: [t.location.lng, t.location.lat], zoom: 16.5, pitch: 45, duration: 800 }); setTimeout(() => showTicket(t), 850);
  }));
}
// Recheck when the app comes back to the screen after a while
let lastCheck = Date.now();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || nav.active) return;
  const p = store.get("plate", null);
  if (p && Date.now() - lastCheck > 15 * 60 * 1000) { lastCheck = Date.now(); checkPlate(p.p, p.s, false).catch(() => {}); }
});

// ================= DISPUTE (Step 4) =================
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-dispute]"); if (!a) return;
  e.preventDefault(); e.stopPropagation();
  const t = data?.tickets.find((x) => x.summons === a.dataset.dispute); if (t) { popup?.remove(); disputeSheet(t); }
});
async function disputeSheet(t) {
  const camera = isCamera(t.violation);
  const days = t.ageDays ?? 0, left = 30 - days;
  openSheet("Dispute ticket", `
    <div><div class="vio">${esc(title(t.violation))} · ${money(t.due ?? t.fine)}</div>
      <div class="meta">#${esc(t.summons)} · ${shortDate(t.issued)}${t.location ? " · " + esc(title(t.location.address)) : ""}</div></div>
    ${left > 0 ? `<div class="alert warn"><b>${left} day${left === 1 ? "" : "s"} left</b>Dispute within 30 days of the issue date to avoid late penalties.</div>`
              : `<div class="alert stop"><b>Past 30 days</b>You can still dispute, but late penalties may already apply.${t.judgment ? " If it's in judgment, you'll need the city's Request for Hearing After Judgment form." : ""}</div>`}
    <div class="muted">Why should this ticket be dismissed?</div>
    <div class="reasons" id="rList"><span class="muted">Loading reasons…</span></div>
    <textarea class="inp" id="dDetails" rows="3" maxlength="800" placeholder="Add details in your own words (what the sign said, the meter number, where your car was…)"></textarea>
    <input class="inp" id="dName" maxlength="60" autocomplete="name" placeholder="Your full name (for the signature)" value="${esc(store.get("name", ""))}">
    <button class="btn primary" type="button" id="dGo" disabled>Write my dispute</button>
    <p class="note">The letter only uses what you tell it. Anything you still need to fill in shows up in [brackets].</p>`, "dispute");
  let reason = null;
  try {
    const j = await (await fetch(`/api/dispute/reasons?violation=${encodeURIComponent(t.violation)}`)).json();
    $("#rList").innerHTML = j.reasons.map((r) => `<button type="button" data-r="${r.key}" aria-pressed="false">${esc(r.label)}</button>`).join("");
    document.querySelectorAll("[data-r]").forEach((b) => (b.onclick = () => {
      reason = b.dataset.r; document.querySelectorAll("[data-r]").forEach((x) => x.setAttribute("aria-pressed", x === b)); $("#dGo").disabled = false;
    }));
  } catch { $("#rList").innerHTML = '<span class="muted">Couldn\'t load reasons. Check your connection.</span>'; }
  $("#dGo").onclick = async () => {
    const name = $("#dName").value.trim(); store.set("name", name);
    $("#dGo").disabled = true; $("#dGo").textContent = "Writing…";
    try {
      const r = await fetch("/api/dispute", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
        summons: t.summons, violation: t.violation, issued: t.issued, time: t.time, address: t.location?.address ? title(t.location.address) : "",
        plate: data.plate, state: data.state, fine: t.fine, reason, details: $("#dDetails").value, name }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error);
      letterSheet(t, j);
    } catch (err) { $("#dGo").disabled = false; $("#dGo").textContent = "Write my dispute"; alert2(err.message || "Couldn't write the letter. Try again."); }
  };
}
function alert2(msg) { const d = document.createElement("div"); d.className = "alert stop"; d.innerHTML = `<b>Something went wrong</b>${esc(msg)}`; $("#sheetBody").prepend(d); }
function letterSheet(t, j) {
  openSheet("Your dispute letter", `
    <pre class="letter" id="letter">${esc(j.letter)}</pre>
    <div class="row"><button class="btn primary grow" type="button" id="copyL">Copy letter</button><button class="btn" type="button" id="backL">Edit</button></div>
    <div><b>Attach this evidence</b></div>
    <ol class="ev">${j.evidence.map((e) => `<li>${esc(e)}</li>`).join("")}</ol>
    <div><b>Submit it</b></div>
    <ol class="ev"><li>Tap <b>Open NYC dispute page</b> and choose to dispute online.</li><li>Enter summons <b>${esc(t.summons)}</b>.</li><li>Paste the letter as your statement and upload your evidence.</li></ol>
    <a class="btn green" href="${esc(j.submitUrl)}" target="_blank" rel="noopener" style="text-decoration:none">Open NYC dispute page</a>
    <p class="note">${j.by === "ai" ? "Written with AI from your details. " : ""}Fill in anything in [brackets] before you submit, and check every fact. This is a draft, not legal advice. ${j.camera ? "Camera tickets" : "Parking tickets"} usually go into judgment about ${j.judgmentDay} days after the issue date.</p>`, "letter");
  $("#copyL").onclick = async () => {
    try { await navigator.clipboard.writeText(j.letter); $("#copyL").textContent = "Copied"; }
    catch { const r = document.createRange(); r.selectNodeContents($("#letter")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $("#copyL").textContent = "Selected. Tap Copy"; }
  };
  $("#backL").onclick = () => disputeSheet(t);
}

// ================= CAN I PARK HERE? =================
let checkMarker = null, signMarkers = [], parkedMarker = null, lastPark = null;
const ICON_P = { green: "✓", yellow: "$", red: "✕", unknown: "?" };
function clearCheck() { checkMarker?.remove(); checkMarker = null; signMarkers.forEach((m) => m.remove()); signMarkers = []; }
async function parkCheck(at, fromTap) {
  clearCheck();
  const el = document.createElement("div"); el.className = "checkPin";
  checkMarker = new maplibregl.Marker({ element: el }).setLngLat(at).addTo(map);
  map.easeTo({ center: at, zoom: Math.max(map.getZoom(), 17), offset: [0, -120], duration: 600 });
  openSheet("Can I park here?", '<p class="muted" style="margin:0">Reading the parking signs on this block…</p>', "park");
  try {
    const r = await fetch(`/api/park?lat=${at[1]}&lng=${at[0]}`); const j = await r.json(); if (!r.ok) throw new Error(j.error);
    lastPark = { ...j, at };
    j.signs.forEach((sg) => { const d = document.createElement("div"); d.className = "signDot"; d.title = sg.text; signMarkers.push(new maplibregl.Marker({ element: d }).setLngLat([sg.lng, sg.lat]).addTo(map)); });
    const moveTxt = j.moveBy ? new Date(j.moveBy).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" }) : null;
    openSheet("Can I park here?", `
      <div class="verdict ${j.status}"><div class="ic">${ICON_P[j.status]}</div><div><div class="big2">${esc(j.headline)}</div><div class="muted" style="color:var(--ink);opacity:.85">${esc(j.detail)}</div></div></div>
      ${j.where ? `<div class="muted">📍 ${esc(j.where)}</div>` : ""}
      ${j.rules.length ? `<div><b>Signs on this block</b></div><ul class="rules">${j.rules.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${j.status !== "red" ? `<button class="btn primary" type="button" id="parkHere">${moveTxt ? `I parked here · remind me before ${esc(moveTxt)}` : "I parked here"}</button>` : ""}
      <p class="note">Based on the city's mapped signs for the nearest block. Always check the posted signs, hydrants (stay 15 ft away), driveways and bus stops. ${fromTap ? "" : "Long-press anywhere on the map to check another spot."}</p>`, "park");
    $("#parkHere")?.addEventListener("click", () => saveParked(j, at));
  } catch (e) { openSheet("Can I park here?", `<div class="alert stop"><b>Couldn't check this spot</b>${esc(e.message || "Try again.")}</div>`, "park"); }
}
$("#parkBtn").onclick = async () => {
  try { const p = await getMe(); parkCheck(p, false); }
  catch { const c = map.getCenter(); parkCheck([c.lng, c.lat], false); }
};
// Long-press (or right-click) anywhere on the map to check that spot
map.on("contextmenu", (e) => { if (!nav.active) parkCheck([e.lngLat.lng, e.lngLat.lat], true); });
let pressT = null;
map.on("touchstart", (e) => { if (e.originalEvent.touches.length !== 1 || nav.active) return; const ll = e.lngLat; pressT = setTimeout(() => parkCheck([ll.lng, ll.lat], true), 650); });
["touchend", "touchmove", "dragstart", "zoomstart"].forEach((ev) => map.on(ev, () => clearTimeout(pressT)));

// ---------- Parked car + move-by countdown ----------
function saveParked(j, at) {
  const car = { at, moveBy: j.moveBy, where: j.where, headline: j.headline, savedAt: Date.now() };
  store.set("parked", car); clearCheck(); closeSheet(); drawParked();
  if (j.moveBy) {
    openSheet("Parked ✓", `
      <div class="verdict green"><div class="ic">P</div><div><div class="big2">Move by ${esc(new Date(j.moveBy).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" }))}</div><div class="muted" style="color:var(--ink)">The app will warn you 30 minutes before when it's open.</div></div></div>
      <a class="btn primary" style="text-decoration:none" href="/api/park/reminder.ics?t=${encodeURIComponent(j.moveBy)}&w=${encodeURIComponent(j.where || "")}">Add phone reminder</a>
      <p class="note">The phone reminder goes in your Calendar app and alerts you 30 and 5 minutes before, even when this app is closed.</p>`, "parked");
  }
}
function drawParked() {
  parkedMarker?.remove(); parkedMarker = null;
  const car = store.get("parked", null), pill = $("#parkedPill");
  if (!car) { pill.hidden = true; return; }
  const el = document.createElement("div"); el.className = "carPin"; el.textContent = "P";
  el.onclick = (e) => { e.stopPropagation(); parkedSheet(); };
  parkedMarker = new maplibregl.Marker({ element: el }).setLngLat(car.at).addTo(map);
  tickParked();
}
function tickParked() {
  const car = store.get("parked", null), pill = $("#parkedPill");
  if (!car) { pill.hidden = true; return; }
  pill.hidden = false;
  if (!car.moveBy) { pill.textContent = "🅿️ Parked"; pill.classList.remove("soon"); return; }
  const mins = Math.round((new Date(car.moveBy) - Date.now()) / 60000);
  const left = mins <= 0 ? "Move your car now" : mins < 60 ? `Move in ${mins} min` : mins < 1440 ? `Move in ${Math.floor(mins / 60)}h ${mins % 60}m` : `Move by ${new Date(car.moveBy).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" })}`;
  pill.textContent = `🅿️ ${left}`;
  pill.classList.toggle("soon", mins <= 30);
  if (mins <= 30 && !car.warned) {
    car.warned = true; store.set("parked", car);
    const box = $("#inAlert");
    box.innerHTML = `<div class="ico" style="background:#d93025;color:#fff;font-weight:800">P</div><div style="min-width:0"><b>${mins <= 0 ? "Move your car now" : `Move your car in ${mins} min`}</b><div class="sub">${esc(car.where || "")} · parking rules start soon</div></div><button class="xx" type="button" aria-label="Dismiss">✕</button>`;
    box.hidden = false; box.querySelector(".xx").onclick = (e) => { e.stopPropagation(); box.hidden = true; };
    box.onclick = () => { box.hidden = true; parkedSheet(); };
    speak(mins <= 0 ? "Move your car now. Parking rules are in effect." : `Move your car in ${mins} minutes.`);
  }
}
function parkedSheet() {
  const car = store.get("parked", null); if (!car) return;
  map.flyTo({ center: car.at, zoom: 17, duration: 700 });
  openSheet("Your car", `
    <div class="muted">📍 ${esc(car.where || "Saved spot")} · parked ${new Date(car.savedAt).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" })}</div>
    ${car.moveBy ? `<div class="verdict ${new Date(car.moveBy) - Date.now() < 1800000 ? "red" : "green"}"><div class="ic">P</div><div class="big2">Move by ${esc(new Date(car.moveBy).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" }))}</div></div>
      <a class="btn" style="text-decoration:none" href="/api/park/reminder.ics?t=${encodeURIComponent(car.moveBy)}&w=${encodeURIComponent(car.where || "")}">Add phone reminder</a>` : ""}
    <div class="row"><button class="btn primary grow" type="button" id="walkCar">Directions to my car</button><button class="btn" type="button" id="movedCar">I moved it</button></div>`, "parked");
  $("#movedCar").onclick = () => { store.set("parked", null); parkedMarker?.remove(); parkedMarker = null; $("#parkedPill").hidden = true; closeSheet(); };
  $("#walkCar").onclick = () => { dest = { name: "My car", line: car.where || "", at: car.at }; planRoute(dest); };
}
$("#parkedPill").onclick = parkedSheet;
drawParked();
setInterval(tickParked, 30000);
const _closeSheet = closeSheet;
closeSheet = function () { if (sheetMode === "park") clearCheck(); _closeSheet(); };

// ================= START =================
const savedPlate = store.get("plate", null);
if (savedPlate) checkPlate(savedPlate.p, savedPlate.s, true).catch(() => {});
if (navigator.permissions?.query) navigator.permissions.query({ name: "geolocation" }).then((p) => { if (p.state === "granted") startWatch(); }).catch(() => {});
