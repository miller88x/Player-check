<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#202124">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Plate Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* Layout: full-screen map. Search pill + chips float on top, round buttons on the right,
   sheets slide up only when asked for. Navigation swaps in a green instruction banner and an ETA bar. */
:root{
  --ui:#303134; --ui2:#3c4043; --ink:#e8eaed; --muted:#9aa0a6; --blue:#8ab4f8;
  --curb:#f2c230; --go:#1e9e5a; --stop:#e5484d; --warn:#f08a24; --gone:#6b7682; --nav:#0b6e4f;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#202124;color:var(--ink);font:16px/1.4 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#map{position:fixed;inset:0}
.maplibregl-ctrl-bottom-left{display:none}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--safeB) + 2px)}
.maplibregl-ctrl-attrib{font-size:10px}

/* Top search */
.top{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(var(--safeT) + 10px) 12px 0;display:flex;flex-direction:column;gap:10px;max-width:584px;margin:0 auto;pointer-events:none}
.top > *{pointer-events:auto}
.pill{display:flex;align-items:center;gap:10px;background:var(--ui);border-radius:28px;padding:6px 6px 6px 16px;box-shadow:0 2px 6px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}
.pill input{all:unset;flex:1;min-width:0;font:500 17px var(--body);color:#fff;padding:8px 0}
.pill input::placeholder{color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;border:0;background:var(--curb);display:grid;place-items:center;flex:0 0 auto;position:relative}
.avatar b{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--stop);color:#fff;font:700 11px/18px var(--body);padding:0 4px;display:none}
.avatar.alert b{display:block}
.clear{border:0;background:none;color:var(--muted);padding:6px;display:none}
.results{background:var(--ui);border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.results button{all:unset;display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;border-top:1px solid var(--ui2);cursor:pointer;box-sizing:border-box}
.results button:first-child{border-top:0}
.results .t{font-weight:600}.results .s{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--ui);color:var(--ink);border-radius:18px;padding:7px 14px;font:500 14px var(--body);box-shadow:0 1px 4px rgba(0,0,0,.35);display:flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:#c2e7ff;color:#001d35}

/* Floating buttons */
.fab{position:fixed;right:12px;z-index:9;width:50px;height:50px;border-radius:50%;background:var(--ui);border:0;box-shadow:0 2px 8px rgba(0,0,0,.45);display:grid;place-items:center;padding:0}
#layersBtn{top:calc(var(--safeT) + 122px)}
#locBtn{bottom:calc(var(--safeB) + 98px)}
#dirBtn{bottom:calc(var(--safeB) + 28px);width:56px;height:56px;border-radius:16px;background:#4dd0e1}
#recenter{bottom:calc(var(--safeB) + 110px);left:auto;right:12px;width:auto;height:44px;border-radius:22px;padding:0 16px;font-weight:600;color:var(--blue);display:none;z-index:15}
.layers{position:fixed;right:12px;top:calc(var(--safeT) + 180px);z-index:11;background:var(--ui);border-radius:16px;padding:12px;display:flex;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.45)}
.layers button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.layers button span{width:58px;height:58px;border-radius:12px;border:2px solid transparent}
.layers button[aria-pressed="true"] span{border-color:var(--blue)}
.layers button[aria-pressed="true"]{color:var(--blue)}
#tixPill{position:fixed;left:12px;bottom:calc(var(--safeB) + 32px);z-index:9;border:0;border-radius:24px;background:var(--ui);box-shadow:0 2px 8px rgba(0,0,0,.45);padding:10px 16px;display:none;align-items:center;gap:10px;font-weight:600;max-width:calc(100% - 100px)}
#tixPill i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
#tixPill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:12;max-width:600px;margin:0 auto;background:#202124;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.5);max-height:72%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease}
.sheet.show{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:12px}
.sheet-head h2{margin:0;font:700 20px var(--body);min-width:0}
.x{border:0;background:var(--ui2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.sheet-body{overflow-y:auto;padding:0 16px calc(var(--safeB) + 20px);display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:10px}
.btn{border:0;border-radius:22px;padding:11px 18px;font-weight:600;background:var(--ui2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--blue);color:#062e6f}
.btn.green{background:#1e8e3e;color:#fff}
.btn.grow{flex:1}
.plateBox{background:#f4f2ea;border-radius:10px;border:3px solid #1d3a6e;padding:6px 12px 8px;display:flex;flex-direction:column;align-items:center}
.plateBox small{font:700 12px var(--display);letter-spacing:.3em;color:#1d3a6e;text-transform:uppercase}
.plateBox input{all:unset;width:100%;text-align:center;font:700 40px/1.1 var(--display);letter-spacing:.12em;color:#16243d;text-transform:uppercase}
.plateBox input::placeholder{color:#b6b3a6}
select{font:600 15px var(--body);border-radius:22px;border:0;background:var(--ui2);color:var(--ink);padding:10px 12px}
.saved{display:flex;gap:8px;flex-wrap:wrap}
.saved button{border:0;border-radius:18px;background:var(--ui);padding:6px 12px;font:700 15px var(--display);letter-spacing:.1em}
.muted{color:var(--muted);font-size:14px}
.big{font:700 28px var(--display);font-variant-numeric:tabular-nums}
.alert{border-radius:12px;padding:10px 14px;font-size:14px}
.alert b{display:block;font-size:15px}
.alert.stop{background:color-mix(in srgb,var(--stop) 18%,#202124)}.alert.stop b{color:#ff8a8d}
.alert.warn{background:color-mix(in srgb,var(--warn) 16%,#202124)}.alert.warn b{color:#ffb36b}
.alert.go{background:color-mix(in srgb,var(--go) 18%,#202124)}.alert.go b{color:#6fdc9b}
.seg{display:flex;gap:6px;overflow-x:auto}
.seg button{flex:0 0 auto;border:1px solid var(--ui2);background:none;border-radius:16px;padding:5px 12px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#c2e7ff;color:#001d35;border-color:#c2e7ff}
ul.tix{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.tix li{background:var(--ui);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;cursor:pointer}
.vio{font-weight:600;min-width:0}
.amt{font:700 19px var(--display);text-align:right;font-variant-numeric:tabular-nums}
.meta{color:var(--muted);font-size:13px;min-width:0}
.chipS{justify-self:end;font:700 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:6px;white-space:nowrap;align-self:start}
.chipS.open{background:var(--warn);color:#1a0e02}.chipS.penalty{background:var(--stop);color:#fff}
.chipS.closed,.chipS.dismissed{background:color-mix(in srgb,var(--go) 25%,transparent);color:#6fdc9b}
.chipS.expired{background:var(--ui2);color:var(--muted)}
.links{display:flex;gap:14px;font-size:14px;flex-wrap:wrap}
a{color:var(--blue)}
.note{color:var(--muted);font-size:12px}
.stats{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.camline{display:flex;align-items:center;gap:8px;color:#ffb36b;font-weight:600;font-size:14px}

/* Pins and popups */
.pin{width:30px;height:40px;cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.pin svg{display:block;width:100%;height:100%;transform-origin:50% 100%;transition:transform .15s}
.pin.sel svg{transform:scale(1.35)}
.maplibregl-popup-content{background:var(--ui);color:var(--ink);border-radius:14px;padding:12px 14px;font:14px var(--body);box-shadow:0 6px 20px rgba(0,0,0,.45);min-width:220px}
.maplibregl-popup-tip{border-top-color:var(--ui)!important;border-bottom-color:var(--ui)!important}
.maplibregl-popup-close-button{color:var(--muted);font-size:20px;padding:2px 8px}
.pop h3{margin:0 24px 2px 0;font-size:15px}
.pop .amt{text-align:left;font-size:22px}
.pop .links{margin-top:6px}
.me{width:22px;height:22px;border-radius:50%;background:#4285f4;border:3px solid #fff;box-shadow:0 0 0 6px rgba(66,133,244,.25),0 1px 4px rgba(0,0,0,.4);position:relative}
.me.heading::after{content:"";position:absolute;left:50%;top:-16px;transform:translateX(-50%);border:7px solid transparent;border-bottom:12px solid #4285f4}
.me.nav{width:30px;height:30px;background:none;border:0;box-shadow:none}
.me.nav::after{display:none}
.me.nav svg{display:block}

/* Navigation */
#navTop{position:fixed;left:0;right:0;top:0;z-index:14;padding:calc(var(--safeT) + 8px) 10px 0;display:none;flex-direction:column;gap:8px;max-width:600px;margin:0 auto}
.instr{background:var(--nav);border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.instr svg{flex:0 0 auto}
.instr .dist{font:700 26px var(--body);white-space:nowrap}
.instr .street{font:600 20px/1.2 var(--body)}
.instr .then{font-size:14px;opacity:.85}
.camAlert{background:#d93025;border-radius:14px;padding:10px 14px;display:none;align-items:center;gap:12px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.4);animation:pulse 1s ease-in-out infinite alternate}
.camAlert .lim{margin-left:auto;background:#fff;color:#111;border:3px solid #111;border-radius:6px;padding:2px 6px;text-align:center;font:700 10px/1.1 var(--body)}
.camAlert .lim b{display:block;font-size:20px}
@keyframes pulse{to{background:#b3261e}}
#navBottom{position:fixed;left:0;right:0;bottom:0;z-index:14;background:#202124;border-radius:20px 20px 0 0;padding:14px 16px calc(var(--safeB) + 14px);display:none;align-items:center;gap:14px;box-shadow:0 -6px 20px rgba(0,0,0,.45);max-width:600px;margin:0 auto}
#navBottom .eta{font:700 24px var(--body);color:#81c995}
#navBottom .sub{color:var(--muted);font-size:14px}
#navBottom .end{margin-left:auto;background:#d93025;color:#fff}
#speedo{position:fixed;left:12px;bottom:calc(var(--safeB) + 110px);z-index:14;width:62px;height:62px;border-radius:50%;background:#fff;color:#111;display:none;flex-direction:column;align-items:center;justify-content:center;font:700 22px/1 var(--body);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#speedo small{font-size:10px;font-weight:600}
#speedo.over{background:#d93025;color:#fff}
body.navigating .top,body.navigating .fab:not(#recenter),body.navigating #tixPill,body.navigating .layers{display:none!important}
body.navigating #navTop,body.navigating #navBottom,body.navigating #speedo{display:flex}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.camAlert{animation:none}}
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>

<div class="top" id="top">
  <div class="pill">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#9aa0a6" stroke-width="2.4"/><path d="m15.5 15.5 5 5" stroke="#9aa0a6" stroke-width="2.4" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search here" autocomplete="off" enterkeyhint="search" aria-label="Search for a place">
    <button class="clear" id="qClear" type="button" aria-label="Clear search">✕</button>
    <button class="avatar" id="plateBtn" type="button" aria-label="My plate and tickets">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11v6a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H8v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-6zm2.3-1h9.4l-1-3.2a.5.5 0 0 0-.5-.3H8.8a.5.5 0 0 0-.5.3l-1 3.2zM7.5 14a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4zm9 0a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4z" fill="#14110a"/></svg>
      <b id="badge"></b>
    </button>
  </div>
  <div class="results" id="results" hidden></div>
  <div class="chips" id="chips">
    <button class="chip" type="button" data-layer="tickets"><svg width="14" height="18" viewBox="0 0 30 40" aria-hidden="true"><path d="M15 1C7.3 1 1.5 6.8 1.5 14.3 1.5 24 15 39 15 39s13.5-15 13.5-24.7C28.5 6.8 22.7 1 15 1z" fill="#e5484d"/></svg>My tickets</button>
    <button class="chip" type="button" data-layer="speed"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#f08a24"/><path d="M6.5 9.5h2l1-1.5h5l1 1.5h2a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1z" fill="#fff"/><circle cx="12" cy="13" r="1.8" fill="#f08a24"/></svg>Speed cameras</button>
    <button class="chip" type="button" data-layer="redlight"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#d93025"/><rect x="9" y="5" width="6" height="14" rx="2" fill="#fff"/><circle cx="12" cy="8.5" r="1.6" fill="#d93025"/><circle cx="12" cy="12" r="1.6" fill="#9aa0a6"/><circle cx="12" cy="15.5" r="1.6" fill="#9aa0a6"/></svg>Red light cameras</button>
  </div>
</div>

<button class="fab" id="layersBtn" type="button" aria-label="Map type"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8.5l10 5.5 10-5.5L12 3zm0 13.2L4.2 12 2 13.2l10 5.5 10-5.5-2.2-1.2L12 16.2z" fill="#8ab4f8"/></svg></button>
<div class="layers" id="layers" hidden>
  <button type="button" data-style="map"><span style="background:linear-gradient(135deg,#f2efe9 40%,#aad3df 40% 55%,#f2efe9 55%)"></span>Default</button>
  <button type="button" data-style="sat"><span style="background:linear-gradient(135deg,#3d5a3a,#6b6b55 50%,#2f4b5e)"></span>Satellite</button>
  <button type="button" data-style="dark"><span style="background:linear-gradient(135deg,#1d2633 40%,#0e1621 40% 55%,#1d2633 55%)"></span>Night</button>
</div>
<button class="fab" id="locBtn" type="button" aria-label="Show my location"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6" fill="#8ab4f8"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="#8ab4f8" stroke-width="2"/><path d="M12 1.5v3.5m0 14v3.5M1.5 12H5m14 0h3.5" stroke="#8ab4f8" stroke-width="2"/></svg></button>
<button class="fab" id="dirBtn" type="button" aria-label="Directions"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.7 11.3 12.7 2.3a1 1 0 0 0-1.4 0l-9 9a1 1 0 0 0 0 1.4l9 9a1 1 0 0 0 1.4 0l9-9a1 1 0 0 0 0-1.4zM14 14.5V12h-4v3H8v-4a1 1 0 0 1 1-1h5V7.5l3.5 3.5-3.5 3.5z" fill="#062e33"/></svg></button>
<button class="fab" id="recenter" type="button">Re-center</button>
<button id="tixPill" type="button"><i></i><span></span></button>

<section class="sheet" id="sheet" aria-live="polite">
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x" id="sheetX" type="button" aria-label="Close">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div id="navTop">
  <div class="instr">
    <svg id="navArrow" width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"></svg>
    <div style="min-width:0"><div class="dist" id="navDist"></div><div class="street" id="navStreet"></div><div class="then" id="navThen"></div></div>
  </div>
  <div class="camAlert" id="camAlert">
    <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 8.5h3l1.5-2h6l1.5 2h3a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1z" fill="#fff"/><circle cx="12" cy="13.5" r="3" fill="#d93025"/></svg>
    <div><div id="camText">Speed camera ahead</div><div id="camDist" style="font-weight:500;font-size:14px"></div></div>
    <div class="lim" id="camLim">SPEED<br>LIMIT<b></b></div>
  </div>
</div>
<div id="speedo"><span id="speedNum">0</span><small>mph</small></div>
<div id="navBottom">
  <div><div class="eta" id="navEta"></div><div class="sub" id="navSub"></div></div>
  <button class="btn end" id="navEnd" type="button">Exit</button>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (n) => "$" + (n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
const title = (s) => String(s || "").toLowerCase().replace(/\b\w/g, (m) => m.toUpperCase());
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const NYC = [-73.95, 40.7];
const toRad = (d) => (d * Math.PI) / 180, toDeg = (r) => (r * 180) / Math.PI;
function dist(a, b) {
  const R = 6371000, dLat = toRad(b[1] - a[1]), dLng = toRad(b[0] - a[0]);
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[1])) * Math.cos(toRad(b[1])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function bearing(a, b) {
  const y = Math.sin(toRad(b[0] - a[0])) * Math.cos(toRad(b[1]));
  const x = Math.cos(toRad(a[1])) * Math.sin(toRad(b[1])) - Math.sin(toRad(a[1])) * Math.cos(toRad(b[1])) * Math.cos(toRad(b[0] - a[0]));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}
const angDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);
function fmtDist(m) { const mi = m / 1609.34; return mi >= 0.1 ? `${mi < 10 ? mi.toFixed(1) : Math.round(mi)} mi` : `${Math.max(50, Math.round((m * 3.281) / 50) * 50)} ft`; }
function sayDist(m) { const mi = m / 1609.34; return mi >= 0.2 ? `${mi < 10 ? mi.toFixed(1) : Math.round(mi)} miles` : `${Math.max(100, Math.round((m * 3.281) / 100) * 100)} feet`; }
function fmtMin(s) { const m = Math.max(1, Math.round(s / 60)); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} hr ${m % 60} min`; }
const clock = (secs) => new Date(Date.now() + secs * 1000).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });

// ================= MAP =================
const STYLES = { map: "https://tiles.openfreemap.org/styles/liberty", sat: "https://tiles.openfreemap.org/styles/liberty", dark: "https://tiles.openfreemap.org/styles/dark" };
let mapType = store.get("mapType", "map");
const map = new maplibregl.Map({ container: "map", style: STYLES[mapType], center: NYC, zoom: 11, attributionControl: { compact: true } });
let layerOn = store.get("layers", { tickets: true, speed: true, redlight: true });
let cams = [];

  g.fillStyle = color; g.beginPath(); g.arc(28, 28, 23, 0, 7); g.fill();
  g.fillStyle = "#fff";
  if (kind === "speed") { rr(13, 21, 30, 19, 3); g.fillRect(22, 17, 12, 6); g.fillStyle = color; g.beginPath(); g.arc(28, 30.5, 5.5, 0, 7); g.fill(); }

}

let me = null, meMarker = null, heading = null, speedMps = 0, watchId = null, lastFix = null;
const waiters = [];
function startWatch() {
  if (watchId !== null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(
    (p) => { if (!nav.sim) onFix({ lng: p.coords.longitude, lat: p.coords.latitude, heading: p.coords.heading, speed: p.coords.speed }); },
    (err) => { if (err.code === 1) { watchId = null; } },
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
}
function onFix(f) {
  const pos = [f.lng, f.lat];
  if (lastFix) {
    const moved = dist(lastFix.pos, pos), dt = (Date.now() - lastFix.t) / 1000;
    if (f.speed == null && dt > 0) f.speed = moved / dt;
    if ((f.heading == null || isNaN(f.heading)) && moved > 4) f.heading = bearing(lastFix.pos, pos);
  }
  if (f.heading != null && !isNaN(f.heading) && (f.speed || 0) > 1.5) heading = f.heading;
  speedMps = f.speed || 0; lastFix = { pos, t: Date.now() }; me = pos;
  if (!meMarker) { const d = document.createElement("div"); d.className = "me"; meMarker = new maplibregl.Marker({ element: d, rotationAlignment: "map" }).setLngLat(pos).addTo(map); }
  meMarker.setLngLat(pos);
  const el = meMarker.getElement();
  if (nav.active) {
    if (el.className !== "me nav") { el.className = "me nav"; el.innerHTML = '<svg width="30" height="30" viewBox="0 0 30 30"><path d="M15 2 26 27l-11-6-11 6z" fill="#4285f4" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg>'; }
  } else { el.className = "me" + (heading != null ? " heading" : ""); el.innerHTML = ""; }
  meMarker.setRotation(heading || 0);
  if (nav.active) navTick(pos); else freeDriveCams(pos);
  waiters.splice(0).forEach((fn) => fn(pos));
}
function getMe(timeout = 15000) {
  if (me) return Promise.resolve(me);
  startWatch();
  return new Promise((res, rej) => { waiters.push(res); setTimeout(() => rej(new Error("no-fix")), timeout); });
}
$("#locBtn").onclick = async () => {
  try { const p = await getMe(); map.flyTo({ center: p, zoom: 16, duration: 800 }); }
  catch { notice("Location needed", "Allow location for this site. On iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using."); }
};

    const list = (j.features || []).map((f) => {
      const p = f.properties;
      const name = p.name || [p.housenumber, p.street].filter(Boolean).join(" ") || p.city || "Place";
      const line = [p.name && p.street ? [p.housenumber, p.street].filter(Boolean).join(" ") : "", p.district || p.locality, p.city, p.state].filter(Boolean).filter((x, i, a) => a.indexOf(x) === i && x !== name).join(", ");

}

let route = null;

function clearRoute() { route = null; map.getSource("route")?.setData(routeGeo()); }
async function fetchRoute(from, to) {
  const j = await (await fetch(`https://router.project-osrm.org/route/v1/driving/${from[0]},${from[1]};${to[0]},${to[1]}?overview=full&geometries=geojson&steps=true`)).json();
  if (j.code !== "Ok" || !j.routes?.length) throw new Error("No route");
  const r = j.routes[0], coords = r.geometry.coordinates;
  const cum = [0]; for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + dist(coords[i - 1], coords[i]));
  let acc = 0;
  const steps = r.legs[0].steps.map((s) => { const st = { ...s, at: acc }; acc += s.distance; return st; });
  const R = { coords, cum, steps, duration: r.duration, distance: r.distance, total: cum[cum.length - 1] || 1 };
  R.camsOnRoute = camsAlong(R);
  return R;
}
const KX = 84300, KY = 111200; // meters per degree near NYC
function project(R, p, hint = 0, wide = false) {
  let best = { along: 0, off: Infinity, idx: 0 };
  const scan = (a, b) => {
    for (let i = a; i < b; i++) {
      const A = R.coords[i], B = R.coords[i + 1];
      const ax = (B[0] - A[0]) * KX, ay = (B[1] - A[1]) * KY, px = (p[0] - A[0]) * KX, py = (p[1] - A[1]) * KY;
      const L = ax * ax + ay * ay, t = L ? Math.max(0, Math.min(1, (px * ax + py * ay) / L)) : 0;
      const off = Math.hypot(px - t * ax, py - t * ay);
      if (off < best.off) best = { along: R.cum[i] + t * Math.sqrt(L), off, idx: i };
    }
  };
  const n = R.coords.length - 1;
  if (wide) scan(0, n); else { scan(Math.max(0, hint - 30), Math.min(n, hint + 300)); if (best.off > 80) scan(0, n); }
  return best;
}
const DIRB = { NB: 0, EB: 90, SB: 180, WB: 270 };
function camsAlong(R) {
  if (!cams.length) return [];
  let minX = 180, minY = 90, maxX = -180, maxY = -90;
  R.coords.forEach(([x, y]) => { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); });
  const out = [];
  for (const c of cams) {
    if (c.lng < minX - 0.001 || c.lng > maxX + 0.001 || c.lat < minY - 0.001 || c.lat > maxY + 0.001) continue;
    const pr = project(R, [c.lng, c.lat], 0, true);
    if (pr.off > 35) continue;
    const i = pr.idx, rb = bearing(R.coords[i], R.coords[Math.min(i + 1, R.coords.length - 1)]);
    if (c.dir && angDiff(rb, DIRB[c.dir]) > 70) continue; // that camera watches the other direction
    out.push({ ...c, along: pr.along });
  }
  return out.sort((a, b) => a.along - b.along);
}
async function planRoute(to) {
  openSheet("Directions", '<p class="muted" style="margin:0">Finding your location and the fastest route…</p>', "route");
  let from;
  try { from = await getMe(); }
  catch { $("#sheetBody").innerHTML = '<div class="alert stop"><b>Location needed</b>Allow location for this site to get directions. On iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using.</div>'; return; }
  try { route = await fetchRoute(from, to.at); }
  catch { $("#sheetBody").innerHTML = '<div class="alert stop"><b>No route</b>Couldn\'t find a driving route there. Try another place.</div>'; return; }
  map.getSource("route")?.setData(routeGeo());
  const b = new maplibregl.LngLatBounds(); route.coords.forEach((c) => b.extend(c));
  map.fitBounds(b, { padding: { top: 140, bottom: 280, left: 50, right: 70 }, duration: 700 });
  routeSheet(to);
}
function routeSheet(to) {
  const sp = route.camsOnRoute.filter((c) => c.type === "speed").length, rl = route.camsOnRoute.length - sp;
  openSheet(to.name, `
    <div class="stats"><span class="big" style="color:#81c995">${fmtMin(route.duration)}</span><span class="muted">${fmtDist(route.distance)} · arrive ${clock(route.duration)}</span></div>
    <div class="camline"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#f08a24"/><path d="M6.5 9.5h2l1-1.5h5l1 1.5h2a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1z" fill="#fff"/></svg>
      ${cams.length ? `${sp} speed camera${sp === 1 ? "" : "s"} · ${rl} red light camera${rl === 1 ? "" : "s"} on this route` : "Camera map is still loading"}</div>
    <div class="row"><button class="btn green grow" type="button" id="startNav">Start</button><button class="btn" type="button" id="simNav">Test drive</button></div>
    <label class="muted" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="voiceT" ${voiceOn ? "checked" : ""}> Voice guidance</label>
    <p class="note">Test drive plays the trip on the map so you can hear the turn and camera warnings from home. Keep the app open while driving.</p>`, "route");
  $("#voiceT").onchange = (e) => { voiceOn = e.target.checked; store.set("voice", voiceOn); };
  $("#startNav").onclick = () => startNav(false);
  $("#simNav").onclick = () => startNav(true);
}

// ================= NAVIGATION =================
const nav = { active: false, sim: null, along: 0, idx: 0, offCount: 0, spoken: {}, camWarned: {}, follow: true, lastReroute: 0 };
function startNav(sim) {
  if (!route) return;
  speak(sim ? "Starting test drive" : "Starting route"); // also unlocks speech on iPhone
  Object.assign(nav, { active: true, along: 0, idx: 0, offCount: 0, spoken: {}, camWarned: {}, follow: true });
  $("#sheet").classList.remove("show"); sheetMode = null;
  document.body.classList.add("navigating"); popup?.remove();
  try { navigator.wakeLock?.request("screen").then((l) => (nav.lock = l)).catch(() => {}); } catch {}
  if (sim) {
    let d = 0; const v = 20; // about 45 mph
    nav.sim = setInterval(() => {
      d = Math.min(route.total, d + v);
      const p = pointAt(route, d), p2 = pointAt(route, Math.min(route.total, d + 15));
      onFix({ lng: p[0], lat: p[1], heading: bearing(p, p2), speed: v });
      if (d >= route.total) { clearInterval(nav.sim); }
    }, 1000);
  } else { startWatch(); if (me) navTick(me); }
}
function pointAt(R, d) {
  let i = 0; while (i < R.cum.length - 2 && R.cum[i + 1] < d) i++;
  const seg = R.cum[i + 1] - R.cum[i] || 1, t = Math.min(1, (d - R.cum[i]) / seg);
  return [R.coords[i][0] + (R.coords[i + 1][0] - R.coords[i][0]) * t, R.coords[i][1] + (R.coords[i + 1][1] - R.coords[i][1]) * t];
}
function endNav() {
  const wasSim = !!nav.sim;
  nav.active = false; clearInterval(nav.sim); nav.sim = null;
  try { nav.lock?.release(); } catch {}
  document.body.classList.remove("navigating"); $("#camAlert").style.display = "none"; $("#recenter").style.display = "none";
  try { speechSynthesis.cancel(); } catch {}
  clearRoute(); destMarker?.remove(); destMarker = null;
  map.easeTo({ pitch: 0, bearing: 0, padding: { top: 0, bottom: 0 }, zoom: 14, duration: 600 });
  if (meMarker) { const el = meMarker.getElement(); el.className = "me"; el.innerHTML = ""; }
  if (wasSim) { me = null; meMarker?.remove(); meMarker = null; lastFix = null; heading = null; }
}
$("#navEnd").onclick = endNav;
map.on("dragstart", () => { if (nav.active) { nav.follow = false; $("#recenter").style.display = "block"; } });
$("#recenter").onclick = () => { nav.follow = true; $("#recenter").style.display = "none"; if (me) navTick(me); };

function instruction(s) {
  const m = s.maneuver, name = s.name || s.ref || "the road", mod = m.modifier || "";
  const turn = { left: "Turn left", right: "Turn right", "slight left": "Bear left", "slight right": "Bear right", "sharp left": "Make a sharp left", "sharp right": "Make a sharp right", uturn: "Make a U-turn", straight: "Continue straight" }[mod] || "Continue";
  const toward = s.destinations ? s.destinations.split(",")[0] : name;
  switch (m.type) {
    case "depart": return `Head ${["north", "east", "south", "west"][Math.round((m.bearing_after || 0) / 90) % 4]} on ${name}`;
    case "arrive": return "You have arrived";
    case "merge": return `Merge onto ${name}`;
    case "on ramp": return `Take the ramp toward ${toward}`;
    case "off ramp": return `Take the exit${s.exits ? " " + s.exits.split(";")[0] : ""} toward ${toward}`;
    case "fork": return `Keep ${mod.includes("left") ? "left" : "right"} toward ${toward}`;
    case "roundabout": case "rotary": return `At the roundabout, take exit ${m.exit || 1} onto ${name}`;
    case "new name": case "continue": return mod === "straight" || !mod ? `Continue onto ${name}` : `${turn} to stay on ${name}`;
    default: return `${turn} onto ${name}`;
  }
}
function arrowSVG(s) {
  if (s?.maneuver?.type === "arrive") return '<path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z" fill="#fff"/><circle cx="12" cy="9" r="2.6" fill="#0b6e4f"/>';
  const mod = s?.maneuver?.modifier || "straight";
  const rot = { straight: 0, "slight right": 35, right: 90, "sharp right": 135, uturn: 180, "sharp left": -135, left: -90, "slight left": -35 }[mod] ?? 0;
  return `<g transform="rotate(${rot} 12 12)"><path d="M12 2.5 5 10.5h4.5v11h5v-11H19z" fill="#fff"/></g>`;
}
function navTick(pos) {
  const R = route; if (!R) return;
  const pr = project(R, pos, nav.idx);
  nav.idx = pr.idx; nav.along = Math.max(nav.along - 30, pr.along);
  if (pr.off > 50) nav.offCount++; else nav.offCount = 0;
  if (nav.offCount >= 3 && Date.now() - nav.lastReroute > 15000 && !nav.sim) {
    nav.lastReroute = Date.now(); speak("Rerouting");
    fetchRoute(pos, R.coords[R.coords.length - 1]).then((nr) => { route = nr; nav.idx = 0; nav.along = 0; nav.spoken = {}; map.getSource("route")?.setData(routeGeo()); }).catch(() => {});
  }
  let k = R.steps.findIndex((s) => s.at > nav.along + 5); if (k < 0) k = R.steps.length - 1;
  const next = R.steps[k], after = R.steps[k + 1];
  const toNext = Math.max(0, next.at - nav.along);
  $("#navArrow").innerHTML = arrowSVG(next);
  $("#navDist").textContent = fmtDist(toNext);
  $("#navStreet").textContent = next.maneuver.type === "arrive" ? "Destination" : next.name || next.ref || instruction(next);
  $("#navThen").textContent = after && toNext < 400 ? `Then: ${instruction(after)}` : "";
  const spk = (key, txt) => { if (!nav.spoken[key]) { nav.spoken[key] = 1; speak(txt); } };
  if (toNext < 600 && toNext > 250) spk(`f${k}`, `In ${sayDist(toNext)}, ${instruction(next)}`);
  if (toNext <= 90) spk(`n${k}`, instruction(next));
  const left = Math.max(0, R.total - nav.along), secs = R.duration * (left / R.total);
  $("#navEta").textContent = fmtMin(secs);
  $("#navSub").textContent = `${fmtDist(left)} · ${clock(secs)}`;
  const ahead = R.camsOnRoute.find((c) => c.along > nav.along - 10 && c.along - nav.along < 500);
  showCam(ahead ? { ...ahead, meters: ahead.along - nav.along } : null);
  updateSpeedo(ahead?.type === "speed" ? ahead.limit : null);
  if (left < 25) { spk("arr", "You have arrived"); setTimeout(() => nav.active && endNav(), 3000); }
  if (nav.follow) map.easeTo({ center: pos, bearing: heading ?? 0, pitch: 60, zoom: 17, padding: { top: 260, bottom: 60 }, duration: 950, easing: (t) => t });
}
function showCam(c) {
  const box = $("#camAlert");
  if (!c) { box.style.display = "none"; return; }
  box.style.display = "flex";
  $("#camText").textContent = c.type === "speed" ? "Speed camera ahead" : "Red light camera ahead";
  $("#camDist").textContent = c.meters > 15 ? fmtDist(c.meters) : "Now";
  const showLim = c.type === "speed" && c.limit;
  $("#camLim").style.display = showLim ? "block" : "none";
  $("#camLim b").textContent = c.limit || "";
  const key = `${c.lng},${c.lat}`;
  if (Date.now() - (nav.camWarned[key] || 0) > 5 * 60 * 1000) {
    nav.camWarned[key] = Date.now();
    speak(c.type === "speed" ? `Speed camera ahead${showLim ? `. Speed limit ${c.limit}` : ""}` : "Red light camera ahead");
  }
}
function updateSpeedo(limit) {
  const mph = Math.round(speedMps * 2.237);
  $("#speedNum").textContent = mph;
  $("#speedo").classList.toggle("over", !!limit && mph > limit + 2);
}
const freeWarned = {};
function freeDriveCams(pos) {
  if (heading == null || speedMps < 4 || !cams.length) return;
  for (const c of cams) {
    if (!layerOn[c.type]) continue;
    if (Math.abs(c.lat - pos[1]) > 0.004 || Math.abs(c.lng - pos[0]) > 0.005) continue;
    const p = [c.lng, c.lat], d = dist(pos, p);
    if (d > 300 || angDiff(bearing(pos, p), heading) > 30) continue;
    if (c.dir && angDiff(heading, DIRB[c.dir]) > 60) continue;
    const key = `${c.lng},${c.lat}`;
    if (Date.now() - (freeWarned[key] || 0) < 5 * 60 * 1000) continue;
    freeWarned[key] = Date.now();
    speak(c.type === "speed" ? `Speed camera ahead${c.limit ? `. Limit ${c.limit}` : ""}` : "Red light camera ahead");
    break;
  }
}

// ================= START =================
const savedPlate = store.get("plate", null);
if (savedPlate) checkPlate(savedPlate.p, savedPlate.s, true).catch(() => {});
if (navigator.permissions?.query) navigator.permissions.query({ name: "geolocation" }).then((p) => { if (p.state === "granted") startWatch(); }).catch(() => {});
</script>
