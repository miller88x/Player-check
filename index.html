<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#01050e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rova">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-512.png">
<link rel="manifest" href="/manifest.json">
<title>Rova</title>
<link rel="preload" as="image" href="/rova-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://router.project-osrm.org" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* Layout: full-screen map. Search pill + chips float on top, round buttons on the right,
   sheets slide up only when asked for. Navigation swaps in a green instruction banner and an ETA bar. */
:root{
  --ui:#303134; --ui2:#3c4043; --ink:#e8eaed; --muted:#9aa0a6; --blue:#8ab4f8;
  --curb:#f2c230; --go:#1e9e5a; --stop:#e5484d; --warn:#f08a24; --gone:#6b7682;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Figtree",system-ui,-apple-system,sans-serif;
  --tabH:64px; --nav:#0d5e5a; --nav2:#0a4744; --fab:#1f1f1f; --teal:#5fc6d8;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#202124;color:var(--ink);font:16px/1.4 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#map{position:fixed;inset:0}
.maplibregl-ctrl-bottom-left{display:none}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--safeB) + 2px)}
.maplibregl-ctrl-attrib{display:none!important}
#credit{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safeB) + var(--tabH) + 4px);z-index:8;font:500 9px/1 var(--body);color:rgba(120,120,120,.85);text-shadow:0 0 2px rgba(255,255,255,.6);white-space:nowrap;pointer-events:auto;text-decoration:none}
body.navigating #credit{bottom:calc(var(--safeB) + 96px)}

/* Top search */
.top{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(var(--safeT) + 10px) 12px 0;display:flex;flex-direction:column;gap:10px;max-width:584px;margin:0 auto;pointer-events:none}
.top > *{pointer-events:auto}
.pill{display:flex;align-items:center;gap:12px;background:#303134;border-radius:30px;padding:6px 6px 6px 14px;min-height:60px;box-shadow:0 1px 3px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.28)}
.pill input{all:unset;flex:1;min-width:0;font:400 19px var(--body);color:#fff;padding:8px 0}
.pill input::placeholder{color:var(--muted)}
.pill input::-webkit-search-cancel-button,.pill input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.avatar{width:46px;height:46px;border-radius:50%;border:3px solid #1a73e8;background:#0b57d0;color:#fff;display:grid;place-items:center;flex:0 0 auto;font:600 20px var(--body);padding:0}
.avatar.out{background:#3c4043;border-color:#5f6368}
.clear{border:0;background:none;color:var(--muted);padding:6px;display:none}
.results{background:var(--ui);border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.results button{all:unset;display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;border-top:1px solid var(--ui2);cursor:pointer;box-sizing:border-box}
.results button:first-child{border-top:0}
.results .t{font-weight:600}.results .s{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.results:not([hidden]) + .chips{display:none}
.chip{flex:1 1 auto;min-width:0;justify-content:center;border:1px solid transparent;background:#303134;color:var(--ink);border-radius:20px;padding:9px 10px;font:500 14.5px var(--body);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.35);display:flex;align-items:center;gap:6px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#nearbyChip{flex:0 0 auto}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.catgrid button{border:0;background:#2d2e30;color:var(--ink);border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 14px var(--body)}
.catgrid button i{font-style:normal;font-size:26px;line-height:1}
.chip[aria-pressed="true"]{background:#0e3a4f;border-color:#7cc9f0;color:#d6efff}

/* Floating buttons */
.fab{position:fixed;right:14px;z-index:9;width:56px;height:56px;border-radius:50%;background:var(--fab);border:0;box-shadow:0 2px 6px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.25);display:grid;place-items:center;padding:0}
#layersBtn{top:calc(var(--safeT) + 140px);background:#0f4a52}
#locBtn{bottom:calc(var(--safeB) + var(--tabH) + 92px);border-radius:18px;background:#303134}
#dirBtn{bottom:calc(var(--safeB) + var(--tabH) + 18px);width:64px;height:64px;border-radius:20px;background:var(--teal)}
#recenter{left:14px;right:auto;bottom:calc(var(--safeB) + 128px);width:auto;height:54px;border-radius:27px;padding:0 22px 0 18px;font:600 18px var(--body);color:#fff;background:#1f1f1f;display:none;z-index:15;gap:12px;grid-auto-flow:column;align-items:center}
.layers{position:fixed;right:14px;top:calc(var(--safeT) + 204px);z-index:11;background:var(--ui);border-radius:18px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.45);max-width:calc(100vw - 28px)}
.lhead{font:600 13px var(--body);color:var(--muted)}
.lrow{display:flex;gap:10px}
.lcol{display:flex;flex-direction:column;gap:6px}
.layers .ltog{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:#3c4043;font:500 15px var(--body);color:var(--ink)}
.layers .ltog[aria-pressed="true"]{background:#0e3a4f;color:#d6efff;box-shadow:inset 0 0 0 1px #7cc9f0}
.layers .ltog[aria-pressed="false"]{opacity:.6}
.layers .lrow button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.layers .lrow button span{width:58px;height:58px;border-radius:12px;border:2px solid transparent}
.layers .lrow button[aria-pressed="true"] span{border-color:var(--blue)}
.layers .lrow button[aria-pressed="true"]{color:var(--blue)}
.reasons{display:flex;flex-direction:column;gap:8px}
.reasons button{all:unset;cursor:pointer;background:var(--ui);border-radius:12px;padding:12px 14px;font-weight:500;border:2px solid transparent}
.reasons button[aria-pressed="true"]{border-color:var(--blue);background:#1f2a3a}
textarea.inp,input.inp{font:500 16px var(--body);border:0;border-radius:12px;padding:12px 14px;background:var(--ui);color:var(--ink);width:100%;resize:vertical}
pre.letter{white-space:pre-wrap;font:15px/1.5 var(--body);background:#fff;color:#202124;border-radius:14px;padding:16px;margin:0;max-height:none;user-select:text;-webkit-user-select:text}
ol.ev{margin:0;padding-left:20px;color:var(--ink);font-size:14px;display:flex;flex-direction:column;gap:4px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rgrid button{all:unset;cursor:pointer;background:var(--ui);border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px;font-weight:600;line-height:1.2}
.rgrid button i{font-style:normal;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px}
.rgrid button:active{transform:scale(.96)}
.votes{display:flex;gap:8px;margin-top:8px}
.votes button{flex:1;border:0;border-radius:16px;padding:8px;font-weight:600;background:var(--ui2);color:var(--ink)}
.verdict{border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center}
.verdict .big2{font:700 21px/1.2 var(--body)}
.verdict .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:800 24px var(--body);color:#fff;flex:0 0 auto}
.verdict.green{background:color-mix(in srgb,#1e8e3e 22%,#202124)}.verdict.green .ic{background:#1e8e3e}
.verdict.yellow{background:color-mix(in srgb,#f29900 22%,#202124)}.verdict.yellow .ic{background:#f29900}
.verdict.red{background:color-mix(in srgb,#d93025 24%,#202124)}.verdict.red .ic{background:#d93025}
.verdict.unknown{background:var(--ui)}.verdict.unknown .ic{background:#5f6368}
ul.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.rules li{background:var(--ui);border-radius:10px;padding:10px 12px;font-size:14px}
#parkedPill{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safeT) + 136px);z-index:10;border:0;border-radius:22px;background:#1a73e8;color:#fff;font-weight:700;padding:9px 16px;box-shadow:0 3px 12px rgba(0,0,0,.4);white-space:nowrap;display:flex;gap:8px;align-items:center}
#parkedPill.soon{background:#d93025;animation:pulse2 1.2s ease-in-out infinite alternate}
@keyframes pulse2{to{background:#a50e0e}}
.carPin{width:34px;height:34px;border-radius:9px;background:#1a73e8;border:3px solid #fff;color:#fff;font:800 17px var(--body);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.catPin{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:#fff;display:grid;place-items:center;font-size:17px;box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer}
.signDot{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #d93025;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.checkPin{width:22px;height:22px;border-radius:50%;background:#1a73e8;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
body.navigating #parkedPill{display:none!important}
.inAlert{position:fixed;left:12px;right:12px;top:calc(var(--safeT) + 136px);z-index:11;max-width:560px;margin:0 auto;border-radius:18px;background:#fff;color:#202124;box-shadow:0 8px 28px rgba(0,0,0,.35);display:flex;gap:12px;align-items:flex-start;padding:14px 14px 14px 16px;cursor:pointer;animation:drop .35s ease both}
.inAlert .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.inAlert b{display:block;font-size:16px}
.inAlert .sub{font-size:14px;color:#5f6368;margin-top:2px}
.inAlert .more{font-size:13px;color:#1a73e8;font-weight:600;margin-top:4px}
.inAlert .xx{margin-left:auto;border:0;background:#f1f3f4;color:#5f6368;width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}}
ul.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.alist li{background:var(--ui);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
ul.alist .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:0 0 auto}
ul.alist .t{font-weight:600}
#tixPill{position:fixed;left:14px;bottom:calc(var(--safeB) + var(--tabH) + 28px);z-index:9;border:0;border-radius:24px;background:#303134;box-shadow:0 2px 8px rgba(0,0,0,.45);padding:10px 16px;display:none;align-items:center;gap:10px;font-weight:600;max-width:calc(100% - 100px)}
#tixPill i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
#tixPill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Full-screen search (Google style) ---------- */
.qback{display:none;border:0;background:none;width:40px;height:40px;border-radius:50%;place-items:center;padding:0;color:#e8eaed;margin-left:-6px}
body.searching .top{bottom:0;max-width:none;background:#1f1f1f;pointer-events:auto;overflow-y:auto;gap:6px;animation:fadeIn .18s ease both}
body.searching .pill{box-shadow:none;background:#303134;padding-left:8px}
body.searching .pill .logo,body.searching #meBtn,body.searching .chips{display:none}
body.searching .qback{display:grid}
body.searching .results{background:none;box-shadow:none;border-radius:0;overflow:visible}
body.searching .fab,body.searching .tabs,body.searching #tixPill{visibility:hidden}
@keyframes fadeIn{from{opacity:0}}
.scuts{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 12px;border-bottom:1px solid #3c4043}
.scuts::-webkit-scrollbar{display:none}
.scut{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0;flex:0 0 auto;max-width:200px}
.scut i{width:40px;height:40px;border-radius:50%;background:#303134;display:grid;place-items:center;flex:0 0 auto;font-style:normal}
.scut b{display:block;font:600 15px var(--body)}.scut small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.rhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font:600 14px var(--body);padding:14px 4px 4px}
.rrow{display:flex;gap:14px;align-items:center;padding:10px 4px;border:0;background:none;color:var(--ink);width:100%;text-align:left;cursor:pointer;animation:rowIn .16s ease both;border-radius:12px}
.rrow:active{background:#2a2b2e}
.sload{height:3px;border-radius:2px;margin:2px 4px 6px;background:linear-gradient(90deg,transparent,#8ab4f8,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:sl 0.9s linear infinite}
@keyframes sl{from{background-position:-40% 0}to{background-position:140% 0}}
@keyframes rowIn{from{opacity:0;transform:translateY(4px)}}
.rrow .ic{width:44px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11.5px}
.rrow .tx{min-width:0;flex:1}.rrow .t{font:500 16px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rrow .s{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .fill{border:0;background:none;color:var(--muted);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
/* ---------- Place card + directions ---------- */
.pbtns{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pbtns::-webkit-scrollbar{display:none}
.pbtn{flex:0 0 auto;border:1px solid #5f6368;background:none;color:#a8dadf;border-radius:20px;padding:9px 16px;font:600 15px var(--body);display:inline-flex;gap:8px;align-items:center}
.pbtn.main{background:#5fc6d8;border-color:#5fc6d8;color:#00363f}
.pbtn:active,.btn:active,.chip:active,.tab:active,.fab:active{transform:scale(.96)}
.pbtn,.btn,.chip,.fab{transition:transform .12s ease,background .2s ease}
#dirTop{position:fixed;left:12px;right:12px;top:calc(var(--safeT) + 10px);z-index:13;max-width:576px;margin:0 auto;background:#303134;border-radius:20px;padding:10px 8px 10px 16px;box-shadow:0 4px 18px rgba(0,0,0,.4);display:none;align-items:center;gap:10px;animation:dropIn .3s cubic-bezier(.2,.9,.25,1) both}
body.routing #dirTop{display:flex}
body.routing .top,body.routing #layersBtn{display:none}
#dirTop .pts{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;font:500 15px var(--body)}
#dirTop .pts div{display:flex;gap:12px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dirTop .pts div:first-child{color:#8ab4f8}
#dirTop .dot{width:12px;height:12px;border-radius:50%;border:2.5px solid #8ab4f8;flex:0 0 auto}
@keyframes dropIn{from{opacity:0;transform:translateY(-12px)}}
.rbub{background:#fff;color:#202124;font:700 14px var(--body);padding:5px 10px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.35);white-space:nowrap;cursor:pointer;transition:background .2s,color .2s}
.rbub.sel{background:#1a73e8;color:#fff;z-index:2}
.rlist{display:flex;flex-direction:column;gap:2px}
.rl{display:grid;grid-template-columns:62px 1fr;gap:2px 12px;padding:12px 6px;border:0;border-radius:14px;background:none;color:var(--ink);text-align:left;cursor:pointer}
.rl[aria-pressed="true"]{background:#283142}
.rl .tm{grid-row:span 2;font:600 22px/1.05 var(--body);color:#81c995;text-align:center}.rl .tm small{display:block;font-size:13px;font-weight:500}
.rl .a{font:500 15px var(--body)}.rl .b{color:var(--muted);font-size:13.5px}
.tchips{display:flex;gap:8px;flex-wrap:wrap}
.tchip{border:1px solid #5f6368;background:none;color:var(--ink);border-radius:10px;padding:7px 12px;font:500 14px var(--body)}
.tchip[aria-pressed="true"]{background:#004a77;border-color:#004a77;color:#c2e7ff}
.startbtn{background:#8ab4f8;color:#062e6f;border:0;border-radius:24px;padding:12px 22px;font:700 16px var(--body);display:inline-flex;gap:8px;align-items:center}
/* ---------- Driving: light, crisp (Google style) ---------- */
body.navigating #navSide .fab{background:#fff;color:#3c4043;box-shadow:0 2px 6px rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.12)}
body.navigating #recenter{background:#fff;color:#0b5e57;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#navBottom{background:#fff!important;color:#202124}
#navShare{padding:10px 0;font-size:15px;font-weight:600;border-radius:22px;width:100%;color:#1a73e8;background:#e8f0fe;border:0}
#navShare.on{color:#fff;background:#188038}
.truckbox{display:grid;gap:8px}
.rvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.rvopt{display:grid;place-items:center;gap:4px;padding:8px 4px;border-radius:12px;border:2px solid transparent;background:rgba(127,127,127,.12);color:inherit;font:600 12px var(--body);cursor:pointer}
.rvopt[aria-pressed="true"]{border-color:#2f6bff;background:rgba(47,107,255,.14)}
.rvopt i{width:30px;height:30px;border-radius:50%;display:block}
.rvopt span{display:grid;line-height:1.2;text-align:center}.rvopt em{font-style:normal;font-size:10px;color:#f2c230;font-weight:700}
.rover{cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));transition:transform .15s}.rover:active{transform:scale(1.12)}
#navMic.on{background:#d93025!important}#navMic.on rect{fill:#fff}#navMic.on path{stroke:#fff}
#rxPark:empty,#rxWeather:empty{display:none}
#navBottom::before{background:#dadce0!important}
#navBottom .eta{color:#188038!important}
#navBottom .sub{color:#3c4043!important}

/* Bottom tabs (Material 3 style) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:11;height:calc(var(--tabH) + var(--safeB));padding:6px 4px var(--safeB);background:#1b1b1c;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -1px 0 rgba(255,255,255,.06)}
.tab{border:0;background:none;color:#c4c7c5;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12.5px var(--body);padding:0;position:relative}
.tab i{width:60px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
.tab[aria-current="page"]{color:#e3e3e3}
.tab[aria-current="page"] i{background:#004f54}
.tab b{position:absolute;top:-2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--stop);color:#fff;font:700 11px/18px var(--body);padding:0 5px;display:none}
.tab.alert b{display:block}
body.navigating .tabs{display:none}

/* Sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:12;max-width:600px;margin:0 auto;background:#1f1f1f;border-radius:28px 28px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.5);max-height:72%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.25,1)}
.sheet.show{transform:none}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:#5f6368;margin:10px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 8px;gap:12px}
.sheet-head h2{margin:0;font:600 24px var(--body);min-width:0}
.x{border:0;background:var(--ui2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.sheet-body{overflow-y:auto;padding:0 16px calc(var(--safeB) + 20px);display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.sheet-body > *{flex-shrink:0}
.row{display:flex;gap:10px}
.btn{border:0;border-radius:24px;padding:12px 20px;font-weight:600;background:var(--ui2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--blue);color:#062e6f}
.btn.green{background:#1e8e3e;color:#fff}
.btn.grow{flex:1}
.plateBox{background:#f4f2ea;border-radius:10px;border:3px solid #1d3a6e;padding:6px 12px 8px;display:flex;flex-direction:column;align-items:center}
.plateBox small{font:700 12px var(--display);letter-spacing:.3em;color:#1d3a6e;text-transform:uppercase}
.plateBox input{all:unset;width:100%;text-align:center;font:700 40px/1.1 var(--display);letter-spacing:.12em;color:#16243d;text-transform:uppercase}
.plateBox input::placeholder{color:#b6b3a6}
select{font:600 15px var(--body);border-radius:22px;border:0;background:var(--ui2);color:var(--ink);padding:10px 12px}
.saved{display:flex;gap:8px;flex-wrap:wrap}
.saved button{border:0;border-radius:18px;background:var(--ui);padding:6px 12px;font:700 15px var(--display);letter-spacing:.1em}
.muted{color:var(--muted);font-size:14px}
.big{font:700 28px var(--display);font-variant-numeric:tabular-nums}
.alert{border-radius:12px;padding:10px 14px;font-size:14px}
.alert b{display:block;font-size:15px}
.alert.stop{background:color-mix(in srgb,var(--stop) 18%,#202124)}.alert.stop b{color:#ff8a8d}
.alert.warn{background:color-mix(in srgb,var(--warn) 16%,#202124)}.alert.warn b{color:#ffb36b}
.alert.go{background:color-mix(in srgb,var(--go) 18%,#202124)}.alert.go b{color:#6fdc9b}
.seg{display:flex;gap:6px;overflow-x:auto}
.seg button{flex:0 0 auto;border:1px solid var(--ui2);background:none;border-radius:16px;padding:5px 12px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#c2e7ff;color:#001d35;border-color:#c2e7ff}
ul.tix{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.tix li{background:var(--ui);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;cursor:pointer}
.vio{font-weight:600;min-width:0}
.amt{font:700 19px var(--display);text-align:right;font-variant-numeric:tabular-nums}
.meta{color:var(--muted);font-size:13px;min-width:0}
.chipS{justify-self:end;font:700 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:6px;white-space:nowrap;align-self:start}
.chipS.open{background:var(--warn);color:#1a0e02}.chipS.penalty{background:var(--stop);color:#fff}
.chipS.closed,.chipS.dismissed{background:color-mix(in srgb,var(--go) 25%,transparent);color:#6fdc9b}
.chipS.expired{background:var(--ui2);color:var(--muted)}
.links{display:flex;gap:14px;font-size:14px;flex-wrap:wrap}
a{color:var(--blue)}
.note{color:var(--muted);font-size:12px}
.acct{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:14px;padding:12px 14px;background:var(--ui2);color:var(--ink);text-align:left;font:500 15px var(--body)}
.acct .av{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#062e6f;display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.acct small{display:block;color:var(--muted);font-size:13px}
.plan{display:inline-block;border-radius:10px;padding:2px 8px;font:700 12px var(--body);background:var(--ui2);color:var(--ink);text-transform:uppercase;letter-spacing:.04em}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin:4px 0;text-align:center;color:var(--muted);font:500 14px var(--body)}
.brand img{width:min(44vw,170px);height:auto;border-radius:20px;box-shadow:0 8px 30px rgba(26,115,232,.25)}
label.lb{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.stats{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.camline{display:flex;align-items:center;gap:8px;color:#ffb36b;font-weight:600;font-size:14px}

/* Pins and popups */
.pin{width:30px;height:40px;cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.pin svg{display:block;width:100%;height:100%;transform-origin:50% 100%;transition:transform .15s}
.pin.sel svg{transform:scale(1.35)}
.maplibregl-popup-content{background:var(--ui);color:var(--ink);border-radius:14px;padding:12px 14px;font:14px var(--body);box-shadow:0 6px 20px rgba(0,0,0,.45);min-width:220px}
.maplibregl-popup-tip{border-top-color:var(--ui)!important;border-bottom-color:var(--ui)!important}
.maplibregl-popup-close-button{color:var(--muted);font-size:20px;padding:2px 8px}
.pop h3{margin:0 24px 2px 0;font-size:15px}
.pop .amt{text-align:left;font-size:22px}
.pop .links{margin-top:6px}
.me{width:22px;height:22px;border-radius:50%;background:#4285f4;border:3px solid #fff;box-shadow:0 0 0 7px rgba(66,133,244,.22),0 1px 4px rgba(0,0,0,.4)}
.me.heading::after{content:"";position:absolute;left:50%;top:-15px;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:13px solid rgba(66,133,244,.55)}
.me.car{width:max-content;height:max-content;background:none;border:0;box-shadow:none;cursor:pointer;line-height:0}
.me.car svg{display:block}
.me.car::after{display:none}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.vlist button{width:100%;display:flex;align-items:center;gap:12px;border:2px solid transparent;background:#2d2e30;border-radius:14px;padding:10px 14px;text-align:left;color:var(--ink)}
.vlist button[aria-pressed="true"]{border-color:var(--blue);background:#1f2a3a}
.vlist b{display:block;font-size:16px}.vlist small{color:var(--muted);font-size:13px}
.vplay{width:36px;height:36px;border-radius:50%;background:#3c4043;display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.vchk{margin-left:auto;color:var(--blue);font-weight:800;font-size:18px}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vgrid button{border:2px solid transparent;background:#2d2e30;border-radius:16px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 12.5px var(--body);color:var(--ink)}
.vgrid button[aria-pressed="true"]{border-color:var(--blue);background:#1f2a3a}
.vcolors{display:flex;gap:8px;flex-wrap:wrap}
.vcolors button{width:36px;height:36px;border-radius:50%;border:3px solid #3c4043;padding:0}
.vcolors button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--blue)}
.me.nav{width:52px;height:52px;background:none;border:0;box-shadow:none}
.me.nav::after{display:none}
.me.nav svg{display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}

/* Navigation */
#navTop{position:fixed;left:0;right:0;top:0;z-index:14;padding:calc(var(--safeT) + 8px) 12px 0;display:none;flex-direction:column;gap:10px;max-width:600px;margin:0 auto;pointer-events:none}
#navTop > *{pointer-events:auto}
.instrWrap{display:flex;flex-direction:column;align-items:flex-start;position:relative;z-index:0}
.instr{align-self:stretch;background:var(--nav);border-radius:24px;padding:18px 20px;display:flex;gap:16px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.35);color:#fff;position:relative;z-index:1}
.instr .ar{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto;min-width:52px}
.instr .dist{font:700 24px/1.1 var(--body);white-space:nowrap}
.instr .toward{font:500 17px/1.2 var(--body);opacity:.9}
.instr .toward:empty{display:none}
.instr .street{font:500 30px/1.15 var(--body);letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.then{background:var(--nav2);color:#fff;border-radius:0 0 18px 18px;padding:18px 18px 10px;margin-top:-10px;display:flex;align-items:center;gap:10px;font:600 20px var(--body);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.then:empty{display:none}
.camAlert{background:#d93025;border-radius:14px;padding:10px 14px;display:none;align-items:center;gap:12px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.4);animation:pulse 1s ease-in-out infinite alternate}
.camAlert .lim{margin-left:auto;background:#fff;color:#111;border:3px solid #111;border-radius:6px;padding:2px 6px;text-align:center;font:700 10px/1.1 var(--body)}
.camAlert .lim b{display:block;font-size:20px}
@keyframes pulse{to{background:#b3261e}}
#navBottom{position:fixed;left:0;right:0;bottom:0;z-index:14;background:#1b1b1c;border-radius:28px 28px 0 0;padding:18px 18px calc(var(--safeB) + 16px);display:none;grid-template-columns:96px 1fr 96px;align-items:center;gap:8px;box-shadow:0 -6px 20px rgba(0,0,0,.4);max-width:600px;margin:0 auto}
#navBottom::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:2px;background:#5f6368}
#navBottom .mid{text-align:center;min-width:0}
#navBottom .eta{font:500 34px/1.1 var(--body);color:#6dd58c}
#navBottom .sub{color:#c4c7c5;font-size:17px;white-space:nowrap}
#navBottom .end{background:#d93025;color:#fff;padding:0;height:56px;border-radius:28px;font:600 20px var(--body)}
#navRoad{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safeB) + 128px);z-index:14;background:#fff;color:#1a3fd8;font:600 18px var(--body);padding:8px 16px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.35);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis;display:none}
body.navigating #navRoad:not(:empty){display:block}
body.navigating #recenter.on ~ #navRoad{display:none}
#navSide{position:fixed;right:14px;bottom:calc(var(--safeB) + 132px);z-index:14;display:none;flex-direction:column;gap:14px}
#navSide .fab{position:static;width:58px;height:58px;background:#1f1f1f}
#speedo{position:fixed;left:14px;bottom:calc(var(--safeB) + 198px);z-index:14;width:62px;height:62px;border-radius:50%;background:#fff;color:#111;display:none;flex-direction:column;align-items:center;justify-content:center;font:700 22px/1 var(--body);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#speedo small{font-size:10px;font-weight:600}
#speedo.over{background:#d93025;color:#fff}
#limitSign{position:fixed;left:84px;bottom:calc(var(--safeB) + 200px);z-index:14;width:50px;background:#fff;color:#111;border:3px solid #111;border-radius:8px;text-align:center;padding:3px 0 2px;box-shadow:0 2px 8px rgba(0,0,0,.35);font:700 8.5px/1.05 var(--body);display:none;flex-direction:column;align-items:center}
#limitSign b{font:800 24px/1 var(--body);margin-top:1px}
#limitSign.over{border-color:#d93025;color:#d93025;animation:pulse3 .8s ease-in-out infinite alternate}
@keyframes pulse3{to{transform:scale(1.06)}}
body.navigating #limitSign:not([hidden]){display:flex}
.ropts{display:flex;flex-direction:column;gap:8px}
.ropts button{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 12px;border:2px solid transparent;background:#2d2e30;border-radius:14px;padding:10px 14px;text-align:left;color:var(--ink)}
.ropts button[aria-pressed="true"]{border-color:var(--blue);background:#1f2a3a}
.ropts b{font:700 18px var(--body);color:#81c995}.ropts span{color:var(--muted);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ropts em{font-style:normal;font-size:12px;font-weight:700;color:#062e6f;background:var(--blue);border-radius:8px;padding:2px 7px}
.row.avoid{gap:18px;flex-wrap:wrap}.row.avoid label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
#lanes{display:flex;gap:4px;justify-content:center;background:#0a4744;border-radius:0 0 16px 16px;padding:14px 12px 8px;margin-top:-10px;align-self:stretch;margin-inline:18px}
#lanes:empty{display:none}
#lanes svg{background:#0d5e5a;border-radius:6px}
body.navigating .inAlert,body.navigating .top,body.navigating > .fab:not(#recenter),body.navigating #tixPill,body.navigating .layers{display:none!important}
body.navigating #navTop,body.navigating #speedo,body.navigating #navSide{display:flex}
body.navigating #navBottom{display:grid}
body.navigating .sheet{z-index:20}
body.navigating #recenter.on{display:grid!important}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.camAlert{animation:none}}

<style>
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(120% 80% at 50% 40%,#061528 0%,#030b18 50%,#01050e 100%);transition:opacity .45s ease,visibility .45s;padding:24px}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-logo{width:min(64vw,300px);animation:spIn .9s cubic-bezier(.2,.8,.2,1) both}
#splash .sp-logo img{width:100%;height:auto;display:block;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent),linear-gradient(180deg,transparent,#000 5%,#000 95%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent),linear-gradient(180deg,transparent,#000 5%,#000 95%,transparent);mask-composite:intersect}
#splash .sp-tag{color:#9fb6d3;font:600 15px/1.3 Figtree,system-ui,sans-serif;letter-spacing:.02em;text-align:center;animation:spUp .9s .25s ease both}
#splash .sp-bar{width:120px;height:3px;border-radius:3px;background:rgba(74,123,255,.18);overflow:hidden;animation:spUp .6s .4s ease both}
#splash .sp-bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#2f6bff,#7fb0ff);animation:spRun 1.1s ease-in-out infinite}
@keyframes spIn{from{opacity:0;transform:scale(.88) translateY(8px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes spUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spRun{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@media (prefers-reduced-motion:reduce){#splash .sp-logo,#splash .sp-tag,#splash .sp-bar{animation:none}#splash .sp-bar i{animation:none;width:100%}}
</style>
<script>
// Hide the splash once the map is ready (at least ~1.1 s so the logo registers, at most 3.5 s)
(function () {
  const t0 = Date.now(); let gone = false;
  window.hideSplash = function () {
    if (gone) return; gone = true;
    setTimeout(() => { const el = document.getElementById("splash"); if (!el) return; el.classList.add("out"); setTimeout(() => el.remove(), 600); }, Math.max(0, 1100 - (Date.now() - t0)));
  };
  setTimeout(window.hideSplash, 3500);
})();
</script>

<script>

};
const NYC = [-73.95, 40.7];
const toRad = (d) => (d * Math.PI) / 180, toDeg = (r) => (r * 180) / Math.PI;
function dist(a, b) {

// ================= DRIVER REPORTS (types) =================

  traffic: { label: "Traffic jam", e: "🚗", c: "#e8710a", warn: "Traffic jam reported ahead" },

  spot: { label: "Open spot", e: "🅿️", c: "#1e8e3e", warn: null },

let reports = [];
function repIcon(t) {
  const W = 64, H = 76, cv = document.createElement("canvas"); cv.width = W; cv.height = H; const g = cv.getContext("2d");
  g.fillStyle = "rgba(0,0,0,.25)"; g.beginPath(); g.ellipse(32, 72, 10, 3, 0, 0, 7); g.fill();
  g.fillStyle = "#fff"; g.beginPath(); g.arc(32, 30, 29, 0, 7); g.fill(); g.beginPath(); g.moveTo(22, 54); g.lineTo(32, 70); g.lineTo(42, 54); g.fill();
  g.fillStyle = t.c; g.beginPath(); g.arc(32, 30, 25, 0, 7); g.fill();
  g.font = "30px system-ui, Apple Color Emoji, Segoe UI Emoji"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(t.e, 32, 32);

const repGeo = () => ({ type: "FeatureCollection", features: reports.filter((r) => RTYPES[r.type]).map((r) => ({ type: "Feature", properties: { id: r.id, type: r.type }, geometry: { type: "Point", coordinates: [r.lng, r.lat] } })) });

// ================= MAP =================
const STYLES = { map: "https://tiles.openfreemap.org/styles/liberty", sat: "https://tiles.openfreemap.org/styles/liberty", dark: "https://tiles.openfreemap.org/styles/dark" };
let mapType = store.get("mapType", "map");
const map = new maplibregl.Map({ container: "map", style: STYLES[mapType], center: NYC, zoom: 11, attributionControl: false });
map.once("load", () => window.hideSplash?.()); map.once("error", () => window.hideSplash?.());
let layerOn = store.get("layers", { tickets: true, speed: true, redlight: true });
let cams = [];

function camIcon(color, kind) {
  const s = 56, c = document.createElement("canvas"); c.width = c.height = s; const g = c.getContext("2d");
  const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fill(); };
  g.fillStyle = "#fff"; g.beginPath(); g.arc(28, 28, 27, 0, 7); g.fill();
  g.fillStyle = color; g.beginPath(); g.arc(28, 28, 23, 0, 7); g.fill();
  g.fillStyle = "#fff";
  if (kind === "speed") { rr(13, 21, 30, 19, 3); g.fillRect(22, 17, 12, 6); g.fillStyle = color; g.beginPath(); g.arc(28, 30.5, 5.5, 0, 7); g.fill(); }
  else { rr(20, 12, 16, 32, 5); [[18, "#d93025"], [28, "#9aa0a6"], [38, "#9aa0a6"]].forEach(([y, col]) => { g.fillStyle = col; g.beginPath(); g.arc(28, y, 4, 0, 7); g.fill(); }); }
  return { width: s, height: s, data: g.getImageData(0, 0, s, s).data };
}
const camFilter = () => ["in", ["get", "type"], ["literal", ["speed", "redlight"].filter((t) => layerOn[t])]];
const camGeo = () => ({ type: "FeatureCollection", features: cams.map((c, i) => ({ type: "Feature", properties: { i, type: c.type }, geometry: { type: "Point", coordinates: [c.lng, c.lat] } })) });

function addOverlays() {
  try { addOverlaysInner(); } catch (e) { window.reportError2?.("addOverlays: " + e.message, e.stack); }
  try { ensureRouteLayers(); } catch (e) { window.reportError2?.("ensureRouteLayers: " + e.message, e.stack); }
}
// The route line must always exist while a route is open
function ensureRouteLayers() {
  if (!map.isStyleLoaded?.() && !map.getStyle()) return;
  if (!map.getSource("route")) map.addSource("route", { type: "geojson", data: routeGeo() });
  if (!map.getSource("done")) map.addSource("done", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  if (!map.getLayer("route-casing")) map.addLayer({ id: "route-casing", type: "line", source: "route", layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": "#1b2db5", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 7, 16, 16] } });
  if (!map.getLayer("route-line")) map.addLayer({ id: "route-line", type: "line", source: "route", layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": "#4a63ff", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 4.5, 16, 11] } });
  if (!map.getLayer("done-line")) map.addLayer({ id: "done-line", type: "line", source: "done", layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": "#9aa0a6", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 4.5, 16, 12] } });

  if (!map.getLayer("route-casing")) map.addLayer({ id: "route-casing", type: "line", source: "route", layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": "#1b2db5", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 7, 16, 16] } });
  if (!map.getLayer("route-line")) map.addLayer({ id: "route-line", type: "line", source: "route", layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": "#4a63ff", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 4.5, 16, 11] } });
  if (!map.getLayer("done-line")) map.addLayer({ id: "done-line", type: "line", source: "done", layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": "#9aa0a6", "line-width": ["interpolate", ["linear"], ["zoom"], 10, 4.5, 16, 12] } });
  for (const [k, t] of Object.entries(RTYPES)) if (!map.hasImage(`rep-${k}`)) map.addImage(`rep-${k}`, repIcon(t), { pixelRatio: 2 });

  if (!map.getSource("cams")) map.addSource("cams", { type: "geojson", data: camGeo() });
  if (!map.getLayer("cams")) map.addLayer({ id: "cams", type: "symbol", source: "cams", minzoom: 12.5, filter: camFilter(),
    layout: { "icon-image": ["case", ["==", ["get", "type"], "speed"], "cam-speed", "cam-red"], "icon-size": ["interpolate", ["linear"], ["zoom"], 10.5, 0.45, 14, 0.8, 17, 1], "icon-allow-overlap": true } });
}
map.on("style.load", addOverlays);
// Crisp, Google-like look for the default map: soft gray ground, white streets, yellow highways, see-through 3D buildings
function googleTheme() {
  if (mapType !== "map") return;
  try { map.setLight({ anchor: "viewport", color: "#ffffff", intensity: 0.22, position: [1.3, 210, 40] }); } catch {}

    const id = l.id;

    else if (l.type === "fill" && /water/.test(id)) set(id, "fill-color", "#a6d1f7");
    else if (l.type === "fill" && /park|grass|wood|forest|garden|pitch|nature|meadow|scrub|cemetery/.test(id)) set(id, "fill-color", "#c8ebcf");
    else if (l.type === "fill" && /building/.test(id)) { set(id, "fill-color", "#e6e7ea"); set(id, "fill-outline-color", "#d6d8dc"); }

    else if (l.type === "fill-extrusion") { set(id, "fill-extrusion-color", "#ffffff"); set(id, "fill-extrusion-opacity", 0.6); set(id, "fill-extrusion-vertical-gradient", true); }

function bestVoice() {

  return vs.find((v) => /premium/i.test(v.name)) || vs.find((v) => /enhanced|natural|neural/i.test(v.name)) || vs.find((v) => /Google US English|Samantha|Ava|Zoe/i.test(v.name)) || vs[0] || null;

// ---------- Hands-free voice commands while driving ----------
const VOICE_REPORTS = [[/police|cop/, "police"], [/accident|crash|wreck/, "accident"], [/traffic|jam/, "traffic"], [/construction|work zone|road ?work/, "construction"],
  [/closed|closure|road ?block/, "closed"], [/pot ?hole/, "pothole"], [/tow/, "tow"], [/ticket|meter maid|traffic agent/, "agent"], [/sweeper/, "sweeper"], [/camera/, "camera"], [/hazard|debris|object|something on the road/, "hazard"]];

  const t = text.toLowerCase();
  if (/share|send.*(eta|location|drive)/.test(t)) return shareDrive();
  if (/unmute|voice on/.test(t)) { voiceOn = true; store.set("voice", true); paintMute(); return speak("Voice on"); }
  if (/mute|quiet|voice off/.test(t)) { speak("Muting voice"); setTimeout(() => { voiceOn = false; store.set("voice", false); stopVoice(); paintMute(); }, 900); return; }
  if (/how long|when.*arrive|eta|how far|time left/.test(t) && route) return speak(`You'll arrive around ${clock(tripEta(route))}. ${fmtMin(tripEta(route))} and ${sayDist(route.total - nav.along)} to go.`);
  if (/park/.test(t) && /(can i|where|destination|there)/.test(t) && nav.dest?.at) { speak("Checking parking at your destination"); return destParking(nav.dest, true); }
  for (const [re, cat] of VOICE_STOPS) if (re.test(t) && /stop|find|add|need|get|nearest|on the way/.test(t) && nav.dest) { speak(`Looking for ${CATS[cat][2].toLowerCase()} on your route`); return stopSearch(cat, nav.dest); }

function listen() {

// ---------- Weather on your route (Open-Meteo, free) ----------
function weatherWord(code, mm, vis, snow) {
  if (code >= 95) return { e: "⛈️", t: "Thunderstorms", bad: 3 };
  if (code === 66 || code === 67 || code === 56 || code === 57) return { e: "🧊", t: "Freezing rain", bad: 3 };
  if (snow > 0.3 || (code >= 71 && code <= 77) || code === 85 || code === 86) return { e: "🌨️", t: "Snow", bad: 3 };
  if (code === 65 || code === 82 || mm >= 4) return { e: "🌧️", t: "Heavy rain", bad: 2 };
  if (vis != null && vis < 500 || code === 45 || code === 48) return { e: "🌫️", t: "Fog, low visibility", bad: 2 };
  if (code === 63 || code === 81 || mm >= 1.5) return { e: "🌧️", t: "Rain", bad: 1 };
  return null;
}
async function routeWeather(R) {
  if (!R || R.weather !== undefined) return R?.weather;
  R.weather = null;
  const n = Math.min(8, Math.max(2, Math.ceil(R.total / 15000)));
  const marks = Array.from({ length: n }, (_, i) => R.total * (i / (n - 1)));
  const pts = marks.map((d) => pointAt(R, d)), t0 = timeLeft(R, 0);
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${pts.map((p) => p[1].toFixed(3)).join(",")}&longitude=${pts.map((p) => p[0].toFixed(3)).join(",")}&hourly=precipitation,weather_code,visibility,snowfall&forecast_hours=12&timezone=GMT`;
    let j = await (await fetch(u, { signal: AbortSignal.timeout ? AbortSignal.timeout(8000) : undefined })).json(); if (!Array.isArray(j)) j = [j];
    let worst = null;
    j.forEach((loc, i) => {
      const when = Date.now() + (t0 - timeLeft(R, marks[i])) * 1000, h = loc.hourly; if (!h) return;
      const k = h.time.findIndex((x) => new Date(x + "Z").getTime() + 3600e3 > when); if (k < 0) return;
      const w = weatherWord(h.weather_code[k], h.precipitation[k], h.visibility?.[k], h.snowfall?.[k]);
      if (w && (!worst || w.bad > worst.bad)) worst = { ...w, along: marks[i], when };
    });
    R.weather = worst;
    if (worst) { R.wxHz = { type: "weather", along: Math.max(0, worst.along - 3000), name: `${worst.t} ahead`, e: worst.e }; if (R.hazards) { R.hazards.push(R.wxHz); R.hazards.sort((a, b) => a.along - b.along); } }
  } catch {}
  return R.weather;
}
HZ.weather = { e: "🌧️", t: "Bad weather ahead", warn: 2500, c: "#5f6368" };

  return destParkCache.get(k);
}

async function disputeSheet(t) {

  const days = t.ageDays ?? 0, left = 30 - days;
  openSheet("Dispute ticket", `
    <div><div class="vio">${esc(title(t.violation))} · ${money(t.due ?? t.fine)}</div>
      <div class="meta">#${esc(t.summons)} · ${shortDate(t.issued)}${t.location ? " · " + esc(title(t.location.address)) : ""}</div></div>
    ${left > 0 ? `<div class="alert warn"><b>${left} day${left === 1 ? "" : "s"} left</b>Dispute within 30 days of the issue date to avoid late penalties.</div>`
              : `<div class="alert stop"><b>Past 30 days</b>You can still dispute, but late penalties may already apply.${t.judgment ? " If it's in judgment, you'll need the city's Request for Hearing After Judgment form." : ""}</div>`}
    <div class="muted">Why should this ticket be dismissed?</div>
    <div class="reasons" id="rList"><span class="muted">Loading reasons…</span></div>
    <textarea class="inp" id="dDetails" rows="3" maxlength="800" placeholder="Add details in your own words (what the sign said, the meter number, where your car was…)"></textarea>
    <input class="inp" id="dName" maxlength="60" autocomplete="name" placeholder="Your full name (for the signature)" value="${esc(store.get("name", ""))}">
    <button class="btn primary" type="button" id="dGo" disabled>Write my dispute</button>
    <p class="note">The letter only uses what you tell it. Anything you still need to fill in shows up in [brackets].</p>`, "dispute");
  let reason = null;
  try {
    const j = await (await fetch(`/api/dispute/reasons?violation=${encodeURIComponent(t.violation)}`)).json();
    $("#rList").innerHTML = j.reasons.map((r) => `<button type="button" data-r="${r.key}" aria-pressed="false">${esc(r.label)}</button>`).join("");
    document.querySelectorAll("[data-r]").forEach((b) => (b.onclick = () => {
      reason = b.dataset.r; document.querySelectorAll("[data-r]").forEach((x) => x.setAttribute("aria-pressed", x === b)); $("#dGo").disabled = false;
    }));
  } catch { $("#rList").innerHTML = '<span class="muted">Couldn\'t load reasons. Check your connection.</span>'; }
  $("#dGo").onclick = async () => {
    const name = $("#dName").value.trim(); store.set("name", name);
    $("#dGo").disabled = true; $("#dGo").textContent = "Writing…";
    try {
      const r = await fetch("/api/dispute", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
        summons: t.summons, violation: t.violation, issued: t.issued, time: t.time, address: t.location?.address ? title(t.location.address) : "",
        plate: data.plate, state: data.state, fine: t.fine, reason, details: $("#dDetails").value, name }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error);
      letterSheet(t, j);
    } catch (err) { $("#dGo").disabled = false; $("#dGo").textContent = "Write my dispute"; alert2(err.message || "Couldn't write the letter. Try again."); }
  };
}
function alert2(msg) { const d = document.createElement("div"); d.className = "alert stop"; d.innerHTML = `<b>Something went wrong</b>${esc(msg)}`; $("#sheetBody").prepend(d); }
function letterSheet(t, j) {
  openSheet("Your dispute letter", `
    <pre class="letter" id="letter">${esc(j.letter)}</pre>
    <div class="row"><button class="btn primary grow" type="button" id="copyL">Copy letter</button><button class="btn" type="button" id="backL">Edit</button></div>
    <div><b>Attach this evidence</b></div>
    <ol class="ev">${j.evidence.map((e) => `<li>${esc(e)}</li>`).join("")}</ol>
    <div><b>Submit it</b></div>
    <ol class="ev"><li>Tap <b>Open NYC dispute page</b> and choose to dispute online.</li><li>Enter summons <b>${esc(t.summons)}</b>.</li><li>Paste the letter as your statement and upload your evidence.</li></ol>
    <a class="btn green" href="${esc(j.submitUrl)}" target="_blank" rel="noopener" style="text-decoration:none">Open NYC dispute page</a>
    <p class="note">${j.by === "ai" ? "Written with AI from your details. " : ""}Fill in anything in [brackets] before you submit, and check every fact. This is a draft, not legal advice. ${j.camera ? "Camera tickets" : "Parking tickets"} usually go into judgment about ${j.judgmentDay} days after the issue date.</p>`, "letter");
  $("#copyL").onclick = async () => {
    try { await navigator.clipboard.writeText(j.letter); $("#copyL").textContent = "Copied"; }
    catch { const r = document.createRange(); r.selectNodeContents($("#letter")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $("#copyL").textContent = "Selected. Tap Copy"; }
  };

async function sendReport(type) {

// Reports ahead while driving
const repWarned = {};
function reportsAhead(pos, brg, R) {
  let best = null;
  const mine = new Set(store.get("myReps", []));
  for (const r of reports) {
    const t = RTYPES[r.type]; if (!t?.warn || mine.has(String(r.id))) continue;
    let d;
    if (R) { const pr = project(R, [r.lng, r.lat], 0, true); if (pr.off > 40) continue; d = pr.along - nav.along; if (d < 0 || d > 800) continue; }
    else { if (brg == null) continue; d = dist(pos, [r.lng, r.lat]); if (d > 500 || angDiff(bearing(pos, [r.lng, r.lat]), brg) > 35) continue; }
    if (!best || d < best.d) best = { r, d };
  }
  if (best && Date.now() - (repWarned[best.r.id] || 0) > 10 * 60000) { repWarned[best.r.id] = Date.now(); speak(RTYPES[best.r.type].warn); }
  return best;
}

function saveParked(j, at) {

  store.set("parked", car); clearCheck(); closeSheet(); drawParked();

      <a class="btn primary" style="text-decoration:none" href="/api/park/reminder.ics?t=${encodeURIComponent(j.moveBy)}&w=${encodeURIComponent(j.where || "")}">Add phone reminder</a>

  }

function drawParked() {
  parkedMarker?.remove(); parkedMarker = null;
  const car = store.get("parked", null), pill = $("#parkedPill");
  if (!car) { pill.hidden = true; return; }
  const el = document.createElement("div"); el.className = "carPin"; el.textContent = "P";
  el.onclick = (e) => { e.stopPropagation(); parkedSheet(); };
  parkedMarker = new maplibregl.Marker({ element: el }).setLngLat(car.at).addTo(map);
  tickParked();
}
function tickParked() {
  const car = store.get("parked", null), pill = $("#parkedPill");
  if (!car) { pill.hidden = true; return; }
  pill.hidden = false;
  if (!car.moveBy) { pill.textContent = "🅿️ Parked"; pill.classList.remove("soon"); return; }
  const mins = Math.round((new Date(car.moveBy) - Date.now()) / 60000);
  const left = mins <= 0 ? "Move your car now" : mins < 60 ? `Move in ${mins} min` : mins < 1440 ? `Move in ${Math.floor(mins / 60)}h ${mins % 60}m` : `Move by ${new Date(car.moveBy).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" })}`;
  pill.textContent = `🅿️ ${left}`;
  const warnAt = car.meterEnd && car.moveBy === car.meterEnd ? 10 : 30;
  pill.classList.toggle("soon", mins <= warnAt);
  if (mins <= warnAt && !car.warned) {
    car.warned = true; store.set("parked", car);
    const box = $("#inAlert");
    box.innerHTML = `<div class="ico" style="background:#d93025;color:#fff;font-weight:800">P</div><div style="min-width:0"><b>${mins <= 0 ? "Move your car now" : `Move your car in ${mins} min`}</b><div class="sub">${esc(car.where || "")} · parking rules start soon</div></div><button class="xx" type="button" aria-label="Dismiss">✕</button>`;
    box.hidden = false; box.querySelector(".xx").onclick = (e) => { e.stopPropagation(); box.hidden = true; };
    box.onclick = () => { box.hidden = true; parkedSheet(); };
    speak(warnAt === 10 ? (mins <= 0 ? "Your parking meter has run out." : `Your parking meter runs out in ${mins} minutes.`) : mins <= 0 ? "Move your car now. Parking rules are in effect." : `Move your car in ${mins} minutes.`);
  }
}

const tok = () => store.get("tok", null);
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...(tok() ? { Authorization: `Bearer ${tok()}` } : {}) } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || "Something went wrong. Try again."); e.status = r.status; throw e; }
  return j;
}
function queueSync() { clearTimeout(syncT); syncT = setTimeout(pushSync, 1500); }
function pushSync() {
  if (!account) return;
  const data = {}; for (const k of SYNC) data[k] = store.get(k, null);
  api("/api/me", { method: "PUT", body: JSON.stringify({ data }) }).catch((e) => { if (e.status === 401) signedOut(); });
}
// Combine what's on this phone with what's saved in the account (nothing gets lost)
function mergeIn(sv) {
  for (const k of SYNC) {
    const s = sv?.[k], l = store.get(k, null);
    if (s == null) continue;
    let v = s;
    if (k === "plates") { const all = [...s, ...(l || [])]; v = all.filter((x, i) => all.findIndex((y) => y.p === x.p && y.s === x.s) === i).slice(0, 5); }
    else if ((k === "known" || k === "seenAlerts" || k === "alerts") && l && typeof l === "object") {
      v = { ...l }; for (const pk in s) v[pk] = s[pk] && typeof s[pk] === "object" && l[pk] && typeof l[pk] === "object" ? { ...l[pk], ...s[pk] } : s[pk];
    } else if (k === "parked" && l && (l.savedAt || 0) > (s.savedAt || 0)) v = l;
    try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
  }
  voiceOn = store.get("voice", true);
  drawParked(); paintVehicle(); paintSaved(); refreshSavedEta();
  const p = store.get("plate", null);
  if (p && (!data || data.plate !== p.p)) checkPlate(p.p, p.s, false).catch(() => {});
}
function signedOut() {
  account = null; store.set("tok", null);
  for (const k of SYNC) try { localStorage.removeItem(k); } catch {}
  location.reload();
}

  }
  const signup = mode !== "login";
  openSheet(signup ? "Create account" : "Sign in", `
    <div class="brand"><img src="/rova-logo.jpg" alt="Rova" width="260" height="286"><div>Drive smarter. Park legal. Skip the ticket.</div></div>
    <div class="seg"><button type="button" data-m="signup" aria-pressed="${signup}">Create account</button><button type="button" data-m="login" aria-pressed="${!signup}">Sign in</button></div>
    <form id="authF" style="display:flex;flex-direction:column;gap:12px">
      <label class="lb">Email<input class="inp" id="aEm" type="email" inputmode="email" autocomplete="email" autocapitalize="off" required></label>
      <label class="lb">Password<input class="inp" id="aPw" type="password" autocomplete="${signup ? "new-password" : "current-password"}" minlength="${signup ? 8 : 1}" required></label>
      ${signup ? '<span class="note" style="margin-top:-4px">At least 8 characters.</span>' : ""}
      <button class="btn primary" type="submit" id="aBtn">${signup ? "Create free account" : "Sign in"}</button>
    </form>
    <p class="note">${signup ? "Free forever. Your plates, tickets and parked car follow you to any phone." : "Forgot your password? Password reset by email is coming soon."}</p>
    ${vehRow()}
    <button class="btn" type="button" data-mycar>🚗 My car · renewals & tow help</button>
    <button class="btn" type="button" data-myrover>🎨 My Rover</button>`, "account");
  wireAcct();
  document.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => accountSheet(b.dataset.m)));
  $("#authF").onsubmit = async (e) => {
    e.preventDefault();
    const btn = $("#aBtn"), label = btn.textContent; btn.disabled = true; btn.textContent = signup ? "Creating…" : "Signing in…";
    $("#aErr")?.remove();
    try {
      const j = await api(`/api/auth/${signup ? "signup" : "login"}`, { method: "POST", body: JSON.stringify({ email: $("#aEm").value, password: $("#aPw").value }) });
      store.set("tok", j.token); account = j.user; paintMe();
      mergeIn(account.data); pushSync();
      openSheet(signup ? "You're in" : "Welcome back", `<div class="alert go"><b>${signup ? "Account created" : "Signed in"}</b>${esc(account.email)} · everything on this phone is now saved to your account.</div><button class="btn primary" type="button" id="ok">Done</button>`, "account");
      $("#ok").onclick = () => closeSheet();
    } catch (err) {
      btn.disabled = false; btn.textContent = label;
      const d = document.createElement("div"); d.id = "aErr"; d.className = "alert stop"; d.innerHTML = `<b>${err.status === 409 ? "Already signed up" : "Couldn't do that"}</b>${esc(err.message)}`;
      $("#authF").prepend(d);
      if (err.status === 409) { const a = document.createElement("button"); a.type = "button"; a.className = "btn"; a.textContent = "Sign in instead"; a.onclick = () => accountSheet("login"); d.after(a); }
    }
  };
}

// ================= START =================
paintSaved();
const savedPlate = store.get("plate", null);
if (savedPlate) checkPlate(savedPlate.p, savedPlate.s, true).catch(() => {});
if (tok()) api("/api/me").then((j) => { account = j.user; paintMe(); mergeIn(account.data); pushSync(); }).catch((e) => { if (e.status === 401) { store.set("tok", null); } });
if (navigator.permissions?.query) navigator.permissions.query({ name: "geolocation" }).then((p) => { if (p.state === "granted") startWatch(); }).catch(() => {});
</script>
</body>
</html>
