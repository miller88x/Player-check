<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f1216">
<title>Plate Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* Layout: full-screen map; plate search floats on top; tickets live in a swipe-up bottom sheet */
:root{
  --asphalt:#0f1216; --lane:#181d23; --line:#262d36; --text:#e9edf1; --muted:#8a96a3;
  --curb:#f2c230;
  --go:#2fbf71; --stop:#e5484d; --warn:#f08a24; --gone:#6b7682;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --peek:210px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--asphalt);color:var(--text);font:16px/1.45 var(--body)}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--peek) + 4px)}
.maplibregl-ctrl-bottom-left{display:none}

/* Floating search */
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;z-index:5;pointer-events:none;display:flex;flex-direction:column;gap:10px;max-width:584px;margin:0 auto}
form{pointer-events:auto;display:flex;gap:6px;align-items:center;background:#303134;border-radius:28px;padding:6px 6px 6px 16px;box-shadow:0 2px 6px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}
.plate{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.plate svg{flex:0 0 auto}
.plate input{all:unset;width:100%;font:600 20px/1.4 var(--display);letter-spacing:.14em;color:#fff;text-transform:uppercase}
.plate input::placeholder{color:#9aa0a6;letter-spacing:.02em;font:500 17px var(--body);text-transform:none}
select,button{font:600 15px var(--body);border-radius:20px;border:0;background:#3c4043;color:var(--text);padding:8px 10px}
#go{background:var(--curb);color:#14110a;cursor:pointer;padding:9px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;pointer-events:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;background:#303134;color:#e8eaed;border-radius:18px;padding:7px 14px;font:500 14px var(--body);box-shadow:0 1px 4px rgba(0,0,0,.35);display:flex;align-items:center;gap:6px;cursor:pointer}
.chips button i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chips button[aria-pressed="true"]{background:#c2e7ff;color:#001d35}
.fab{position:fixed;right:12px;z-index:5;width:48px;height:48px;border-radius:50%;background:#303134;border:0;box-shadow:0 2px 8px rgba(0,0,0,.4);display:grid;place-items:center;cursor:pointer;padding:0}
#layersBtn{top:calc(env(safe-area-inset-top,0px) + 120px)}
#locBtn{bottom:calc(var(--peek) + 16px)}
.layers{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 176px);z-index:7;background:#303134;border-radius:16px;padding:12px;display:flex;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.45)}
.layers button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:#e8eaed;font-size:12px}
.layers button span{width:58px;height:58px;border-radius:12px;border:2px solid transparent;background-size:cover}
.layers button[aria-pressed="true"] span{border-color:#8ab4f8}
.layers button[aria-pressed="true"]{color:#8ab4f8}
#go:disabled{opacity:.6}
:focus-visible{outline:2px solid var(--curb);outline-offset:2px}

/* Bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:600px;margin:0 auto;background:var(--asphalt);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.5);height:calc(100% - 90px - env(safe-area-inset-top,0px));transform:translateY(calc(100% - var(--peek)));transition:transform .28s ease;display:flex;flex-direction:column}
.sheet.open{transform:translateY(0)}
.handle{all:unset;display:block;padding:10px 0 4px;cursor:pointer;width:100%}
.handle::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet-body{flex:1;overflow-y:auto;padding:4px 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.head h2{font:700 22px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0}
.head .due{font:700 26px/1 var(--display);color:var(--curb);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:14px;margin-top:-6px}
.alert{border-radius:12px;padding:10px 14px;border:1px solid}
.alert b{display:block;font:700 16px var(--display);letter-spacing:.05em;text-transform:uppercase}
.alert.stop{border-color:var(--stop);background:color-mix(in srgb,var(--stop) 14%,var(--asphalt))}.alert.stop b{color:var(--stop)}
.alert.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--asphalt))}.alert.warn b{color:var(--warn)}
.alert.go{border-color:var(--go);background:color-mix(in srgb,var(--go) 12%,var(--asphalt))}.alert.go b{color:var(--go)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.filters button{flex:0 0 auto;background:transparent;color:var(--muted);padding:5px 12px;font-size:14px;border-radius:999px}
.filters button[aria-pressed="true"]{color:var(--text);border-color:var(--text)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{background:var(--lane);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:3px 12px;cursor:pointer}
li.sel{border-color:var(--curb)}
.vio{font-weight:600;min-width:0}
.amt{font:700 19px var(--display);text-align:right;font-variant-numeric:tabular-nums}
.meta{color:var(--muted);font-size:13px;min-width:0}
.chip{justify-self:end;align-self:start;font:700 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:6px;white-space:nowrap}
.chip.open{background:var(--warn);color:#1a0e02}.chip.penalty{background:var(--stop);color:#fff}
.chip.closed,.chip.dismissed{background:color-mix(in srgb,var(--go) 22%,transparent);color:var(--go)}
.chip.expired{background:var(--line);color:var(--muted)}
.links{grid-column:1/-1;display:flex;gap:14px;font-size:13px;flex-wrap:wrap}
.links a{color:var(--curb)}
.empty{color:var(--muted);text-align:center;padding:12px 0}
.err{color:var(--stop);text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.note{color:var(--muted);font-size:12px}
.saved{display:flex;gap:8px;flex-wrap:wrap}
.saved button{font:700 14px var(--display);letter-spacing:.1em;border-radius:999px;padding:6px 12px;background:var(--lane)}

/* Map pins */
.pin{width:30px;height:40px;cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.pin svg{display:block;width:100%;height:100%;transition:transform .15s;transform-origin:50% 100%}
.pin.approx{opacity:.8}
.pin.sel svg{transform:scale(1.4)}
.pin.sel{z-index:3}
.maplibregl-popup-content{background:var(--lane);color:var(--text);border-radius:10px;padding:8px 12px;font:14px var(--body)}
.maplibregl-popup-tip{border-top-color:var(--lane)!important;border-bottom-color:var(--lane)!important}
.maplibregl-popup-close-button{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<div id="map" aria-label="Map of NYC"></div>

<div class="top">
  <form id="f">
    <div class="plate">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z" fill="#f2c230"/><circle cx="12" cy="9" r="2.6" fill="#303134"/></svg>
      <input id="plate" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="Enter your plate" aria-label="License plate">
    </div>
    <select id="state" aria-label="Plate state"><option>NY</option><option>NJ</option><option>CT</option><option>PA</option><option>MA</option><option>FL</option><option value="99">Other</option></select>
    <button id="go" type="submit">Check</button>
  </form>
  <div class="chips" id="chips">
    <button type="button" data-f="all" aria-pressed="true">All tickets</button>
    <button type="button" data-f="open"><i style="background:var(--warn)"></i>Open</button>
    <button type="button" data-f="penalty"><i style="background:var(--stop)"></i>Penalties</button>
    <button type="button" data-f="closed"><i style="background:var(--go)"></i>Paid</button>
    <button type="button" data-f="expired"><i style="background:var(--gone)"></i>Expired</button>
  </div>
</div>

<button class="fab" id="layersBtn" type="button" aria-label="Map type">
  <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8.5l10 5.5 10-5.5L12 3zm0 13.2L4.2 12 2 13.2l10 5.5 10-5.5-2.2-1.2L12 16.2z" fill="#8ab4f8"/></svg>
</button>
<div class="layers" id="layers" hidden>
  <button type="button" data-style="map" aria-pressed="true"><span style="background:linear-gradient(135deg,#f2efe9 40%,#aad3df 40% 55%,#f2efe9 55%),#f2efe9"></span>Default</button>
  <button type="button" data-style="sat"><span style="background:linear-gradient(135deg,#3d5a3a,#6b6b55 50%,#2f4b5e)"></span>Satellite</button>
  <button type="button" data-style="dark"><span style="background:linear-gradient(135deg,#1d2633 40%,#0e1621 40% 55%,#1d2633 55%)"></span>Night</button>
</div>
<button class="fab" id="locBtn" type="button" aria-label="Show my location">
  <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="#8ab4f8"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3" stroke="#8ab4f8" stroke-width="2"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="#8ab4f8" stroke-width="2"/></svg>
</button>

<section class="sheet" id="sheet">
  <button class="handle" id="handle" type="button" aria-label="Expand ticket list"></button>
  <div class="sheet-body" id="body">
    <div class="head"><h2>Plate Check</h2></div>
    <p class="sub">Enter a plate to see every NYC parking and camera ticket on it, pinned where it happened.</p>
    <div class="saved" id="saved"></div>
  </div>
</section>

<script>
const $ = (s) => document.querySelector(s);
const money = (n) => "$" + (n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
const LABEL = { open: "Open", penalty: "Penalty added", closed: "Paid", dismissed: "Dismissed", expired: "Expired" };
const COLOR = { open: "var(--warn)", penalty: "var(--stop)", closed: "var(--go)", dismissed: "var(--go)", expired: "var(--gone)" };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let data = null, filter = "all", selected = null, markers = {};

// ----- Map -----
const STYLES = { map: "https://tiles.openfreemap.org/styles/liberty", sat: "https://tiles.openfreemap.org/styles/liberty", dark: "https://tiles.openfreemap.org/styles/dark" };
let mapType = "map";
try { mapType = localStorage.getItem("mapType") || "map"; } catch {}
const map = new maplibregl.Map({
  container: "map", style: STYLES[mapType],
  center: [-73.95, 40.68], zoom: 11.2, attributionControl: { compact: true },
});
const geo = new maplibregl.GeolocateControl({ trackUserLocation: true, positionOptions: { enableHighAccuracy: true }, showUserLocation: true });
map.addControl(geo, "bottom-right");
document.querySelector(".maplibregl-ctrl-geolocate")?.closest(".maplibregl-ctrl-group")?.style.setProperty("display", "none");
$("#locBtn").onclick = () => geo.trigger();

// Satellite = Google-style hybrid: imagery under major roads and labels
function applyLook() {
  if (mapType !== "sat") return;
  if (!map.getSource("esri")) map.addSource("esri", { type: "raster", tileSize: 256, maxzoom: 19,
    tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
    attribution: "Imagery © Esri, Maxar, Earthstar Geographics" });
  if (!map.getLayer("esri")) map.addLayer({ id: "esri", type: "raster", source: "esri" }, "tunnel_motorway_link_casing");
  map.getStyle().layers.forEach((l) => {
    if (/^(building|road_area|road_(minor|service|path|link)|tunnel_|bridge_(street|service|path|link))/.test(l.id) || /casing/.test(l.id))
      map.setLayoutProperty(l.id, "visibility", "none");
    else if (/^(road|bridge)_/.test(l.id) && l.type === "line") map.setPaintProperty(l.id, "line-opacity", 0.75);
  });
}
map.on("style.load", applyLook);

function setLook(type) {
  if (type === mapType) return;
  mapType = type;
  try { localStorage.setItem("mapType", type); } catch {}
  map.setStyle(STYLES[type]);
  document.querySelectorAll("[data-style]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.style === type));
  $("#layers").hidden = true;
}
document.querySelectorAll("[data-style]").forEach((b) => {
  b.setAttribute("aria-pressed", b.dataset.style === mapType);
  b.onclick = () => setLook(b.dataset.style);
});
$("#layersBtn").onclick = (e) => { e.stopPropagation(); $("#layers").hidden = !$("#layers").hidden; };
map.on("click", () => ($("#layers").hidden = true));

// Google-style teardrop pins: $ for parking, camera for camera tickets
const ICON = {
  cash: '<text x="15" y="19.5" text-anchor="middle" font-family="Barlow,Arial" font-weight="700" font-size="13" fill="#fff">$</text>',
  cam: '<path d="M9.5 11h2l1-1.5h5l1 1.5h2a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1z" fill="#fff"/><circle cx="15" cy="15" r="2.2" fill="COLOR"/>',
};
const HEX = { open: "#f08a24", penalty: "#e5484d", closed: "#1e9e5a", dismissed: "#1e9e5a", expired: "#6b7682" };
function pinSVG(t) {
  const c = HEX[t.status];
  const camera = /PHTO|CAMERA|BUS LANE|RED LIGHT/i.test(t.violation);
  const ring = t.location.approx ? `stroke="#fff" stroke-width="2" stroke-dasharray="3 2"` : `stroke="#fff" stroke-width="2"`;
  return `<svg viewBox="0 0 30 40" aria-hidden="true"><path d="M15 1C7.3 1 1.5 6.8 1.5 14.3 1.5 24 15 39 15 39s13.5-15 13.5-24.7C28.5 6.8 22.7 1 15 1z" fill="${c}" ${ring}/>${(camera ? ICON.cam : ICON.cash).replace("COLOR", c)}</svg>`;
}

function drawPins() {
  Object.values(markers).forEach((m) => m.remove());
  markers = {};
  if (!data) return;
  const pts = visible().filter((t) => t.location);
  const bounds = new maplibregl.LngLatBounds();
  pts.forEach((t) => {
    const el = document.createElement("div");
    el.className = "pin" + (t.location.approx ? " approx" : "") + (selected === t.summons ? " sel" : "");
    el.innerHTML = pinSVG(t);
    el.title = t.violation;
    el.onclick = (e) => { e.stopPropagation(); select(t.summons, false); };
    markers[t.summons] = new maplibregl.Marker({ element: el, anchor: "bottom" }).setLngLat([t.location.lng, t.location.lat]).addTo(map);
    bounds.extend([t.location.lng, t.location.lat]);
  });
  if (pts.length && !selected) map.fitBounds(bounds, { padding: { top: 140, bottom: 250, left: 50, right: 50 }, maxZoom: 15, duration: 700 });
}

function select(id, fromList) {
  selected = id;
  const t = data.tickets.find((x) => x.summons === id);
  document.querySelectorAll(".pin.sel").forEach((p) => p.classList.remove("sel"));
  markers[id]?.getElement().classList.add("sel");
  document.querySelectorAll("li.sel").forEach((l) => l.classList.remove("sel"));
  const li = document.querySelector(`li[data-id="${id}"]`);
  li?.classList.add("sel");
  if (t?.location) {
    map.flyTo({ center: [t.location.lng, t.location.lat], zoom: 17, pitch: 55, bearing: -17, offset: [0, -80], duration: 900 });
    document.querySelectorAll('.maplibregl-popup').forEach((p) => p.remove());
    new maplibregl.Popup({ offset: 36, closeButton: false }).setLngLat([t.location.lng, t.location.lat])
      .setHTML(`<b>${esc(t.violation)}</b><br>${esc(t.location.address)}${t.location.approx ? " (approx.)" : ""}`).addTo(map);
  }
  if (fromList) $("#sheet").classList.remove("open");
  else li?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

// ----- Sheet -----
$("#handle").onclick = () => $("#sheet").classList.toggle("open");
let y0 = null;
$("#handle").addEventListener("touchstart", (e) => (y0 = e.touches[0].clientY), { passive: true });
$("#handle").addEventListener("touchend", (e) => {
  if (y0 === null) return;
  const dy = e.changedTouches[0].clientY - y0;
  if (dy < -30) $("#sheet").classList.add("open");
  if (dy > 30) $("#sheet").classList.remove("open");
  y0 = null;
});

// ----- Saved plates (this phone only) -----
const store = {
  get() { try { return JSON.parse(localStorage.getItem("plates") || "[]"); } catch { return []; } },
  add(p, s) { try { const l = this.get().filter((x) => x.p !== p); l.unshift({ p, s }); localStorage.setItem("plates", JSON.stringify(l.slice(0, 5))); } catch {} },
};
function savedHTML() {
  return store.get().map(({ p, s }) => `<button type="button" data-p="${esc(p)}" data-s="${esc(s)}">${esc(p)} · ${esc(s === "99" ? "Other" : s)}</button>`).join("");
}
function wireSaved() {
  document.querySelectorAll("[data-p]").forEach((b) => (b.onclick = () => { $("#plate").value = b.dataset.p; $("#state").value = b.dataset.s; check(); }));
}

// ----- Lookup -----
$("#f").onsubmit = (e) => { e.preventDefault(); check(); };
async function check() {
  const plate = $("#plate").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
  const state = $("#state").value;
  if (!plate) return $("#plate").focus();
  $("#plate").blur();
  $("#go").disabled = true; $("#go").textContent = "…";
  $("#body").innerHTML = `<div class="head"><h2>${esc(plate)}</h2></div><p class="sub">Checking city records and placing tickets on the map. This can take up to 20 seconds.</p>`;
  try {
    const r = await fetch(`/api/tickets?plate=${encodeURIComponent(plate)}&state=${state}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    data = j; filter = "all"; selected = null; store.add(plate, state); render(); drawPins();
  } catch (e) {
    $("#body").innerHTML = `<p class="err">${esc(e.message || "Something went wrong. Try again.")}</p><div class="saved">${savedHTML()}</div>`; wireSaved();
  } finally { $("#go").disabled = false; $("#go").textContent = "Check"; }
}

function visible() {
  return data.tickets.filter((t) => filter === "all" || (filter === "open" ? t.status === "open" || t.status === "penalty" : filter === "closed" ? t.status === "closed" || t.status === "dismissed" : t.status === filter));
}

function render() {
  const { summary: s, plate, state } = data;
  const shown = visible();
  let alert;
  if (s.bootRisk) alert = `<div class="alert stop"><b>Boot / tow risk</b>${money(s.judgmentDue)} in tickets older than 100 days. Pay or dispute these first.</div>`;
  else if (s.openCount) alert = `<div class="alert warn"><b>${s.openCount} open ticket${s.openCount > 1 ? "s" : ""}</b>${s.penaltiesAdded ? `Includes ${money(s.penaltiesAdded)} in penalties and interest.` : "No penalties added yet."}</div>`;
  else alert = `<div class="alert go"><b>All clear</b>Nothing owed on this plate.</div>`;

  $("#body").innerHTML = `
    <div class="head"><h2>${esc(plate)} · ${esc(state === "99" ? "Other" : state)}</h2><span class="due">${money(s.totalDue)}</span></div>
    <p class="sub">${s.count} ticket${s.count === 1 ? "" : "s"} all-time · ${s.openCount} open · ${s.mapped} on the map</p>
    ${alert}
    <div class="legend"><span><i style="background:var(--stop)"></i>Penalty</span><span><i style="background:var(--warn)"></i>Open</span><span><i style="background:var(--go)"></i>Paid</span><span><i style="border:2px solid var(--muted)"></i>Approx. spot</span></div>
    ${shown.length ? `<ul>${shown.map(card).join("")}</ul>` : `<p class="empty">No tickets in this view.</p>`}
    <p class="note">Map shows the ${150} most recent tickets from mid-2021 on. Camera tickets list a street, not an address, so their pins are approximate. Judgment and boot flags are estimates: unpaid tickets usually go into judgment about 100 days after issue, and NYC can boot or tow once judgments pass $350.</p>
    <div class="saved">${savedHTML()}</div>`;
  document.querySelectorAll("#chips [data-f]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.f === filter));
  document.querySelectorAll("li[data-id]").forEach((li) => (li.onclick = (e) => { if (e.target.closest("a")) return; select(li.dataset.id, true); }));
  wireSaved();
}

function card(t) {
  const amount = t.due > 0 ? money(t.due) : t.fine !== null ? money(t.fine) : "—";
  const date = t.issued ? new Date(t.issued + "T12:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "Unknown date";
  const where = t.location ? t.location.address + (t.location.approx ? " (approx.)" : "") : [t.county, t.precinct && t.precinct !== "000" ? "Pct " + t.precinct : null].filter(Boolean).join(" · ");
  return `<li data-id="${esc(t.summons)}" class="${selected === t.summons ? "sel" : ""}">
    <span class="vio">${esc(t.violation)}</span><span class="amt">${amount}</span>
    <span class="meta">${date}${t.time ? " · " + esc(t.time) : ""}${where ? " · " + esc(where) : ""}</span>
    <span class="chip ${t.status}">${LABEL[t.status]}</span>
    ${t.judgment ? `<span class="meta" style="grid-column:1/-1;color:var(--stop)">Likely in judgment (${t.ageDays} days old)</span>` : ""}
    <span class="links">
      <span class="meta">#${esc(t.summons)}</span>
      ${t.image ? `<a href="${esc(t.image)}" target="_blank" rel="noopener">View ticket</a>` : ""}
      ${t.due > 0 ? `<a href="https://a836-citypay.nyc.gov/citypay/Parking" target="_blank" rel="noopener">Pay</a><a href="https://www.nyc.gov/site/finance/vehicles/dispute-a-ticket.page" target="_blank" rel="noopener">Dispute</a>` : ""}
    </span>
  </li>`;
}

document.querySelectorAll("#chips [data-f]").forEach((b) => (b.onclick = () => {
  filter = b.dataset.f; selected = null;
  document.querySelectorAll("#chips [data-f]").forEach((x) => x.setAttribute("aria-pressed", x === b));
  if (data) { render(); drawPins(); }
}));
$("#saved").innerHTML = savedHTML(); wireSaved();
</script>
</body>
</html>
